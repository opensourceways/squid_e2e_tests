# HAProxy — TCP 模式负载均衡,分发到 Squid 后端
global
    log /dev/log local0

defaults
    mode tcp
    timeout connect 4s
    timeout client 300s
    timeout server 300s

# Squid 代理池,绑定所有接口
listen squid_pool
    bind 0.0.0.0:3128
    balance source                        # 客户端 IP 亲和,减少缓存重复
    option tcp-check
    server s1 172.30.0.11:3128 check inter 3s rise 2 fall 3
    server s2 172.30.0.12:3128 check inter 3s rise 2 fall 3
    server s3 172.30.0.13:3128 check inter 3s rise 2 fall 3

# 统计页面 (调试用)
listen stats
    bind 0.0.0.0:8404
    mode http
    stats enable
    stats uri /stats
