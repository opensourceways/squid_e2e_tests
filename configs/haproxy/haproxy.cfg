# HAProxy — TCP 模式负载均衡,分发到 Squid 后端
global
    log /dev/log local0
    # 必须显式设置: 不设时 HAProxy 从 RLIMIT_NOFILE 推导 maxconn。Docker 默认
    # LimitNOFILE=infinity(容器内 ulimit -n = 1073741816),推导出 maxconn≈5.4 亿,
    # 分配 fdtab 失败 → "Not enough memory to allocate ... entries for fdtab!" 启动即退出。
    maxconn 20000

defaults
    mode tcp
    timeout connect 4s
    timeout client 300s
    timeout server 300s
    timeout check 2s
    retries 2
    option redispatch                     # 连接失败时改派到其他 Squid,而非把错误抛给客户端

# Squid 代理池,绑定所有接口
listen squid_pool
    bind 0.0.0.0:3128
    balance source                        # 客户端 IP 亲和,减少缓存重复
    hash-type consistent                  # 一致性哈希: 增减节点时只扰动 1/N 客户端(与 PRODUCTION.md 对齐)
    # 裸 tcp-check 只验证 TCP 可连接:Squid 进程卡死/只回 503 时仍判 UP。
    # 发一个代理请求并要求回一个 HTTP 状态行,证明 Squid 真的在解析 HTTP。
    # 相对 URI 在代理端口上是非法请求,Squid 回 400 —— 400 也算存活,且不触发回源。
    option httpchk
    http-check send meth HEAD uri / ver HTTP/1.0
    http-check expect rstatus ^[2345][0-9][0-9]
    # 转发到 Squid 的 3129(require-proxy-header)并用 send-proxy-v2 透传真实客户端地址,
    # 否则 Squid 的 access.log 里客户端永远是本机,无法按 worker/job 归因。
    # check-send-proxy: 健康检查也必须带 PROXY 头,否则会被 3129 拒绝并误判后端 DOWN。
    server s1 172.30.0.11:3129 check check-send-proxy send-proxy-v2 inter 3s rise 2 fall 3
    server s2 172.30.0.12:3129 check check-send-proxy send-proxy-v2 inter 3s rise 2 fall 3
    server s3 172.30.0.13:3129 check check-send-proxy send-proxy-v2 inter 3s rise 2 fall 3

# 统计页面 (调试用)
listen stats
    bind 0.0.0.0:8404
    mode http
    stats enable
    stats uri /stats
