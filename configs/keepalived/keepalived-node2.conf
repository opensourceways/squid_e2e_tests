# keepalived — BACKUP 节点 (priority 90)
vrrp_script chk_haproxy {
    # 见 keepalived-node1.conf 注释: pkill(procps)替代 killall(psmisc,仅 Recommends)
    script "/usr/bin/pkill -0 -x haproxy"
    interval 2
    weight -20
    fall 2
    rise 2
}

vrrp_instance VI_SQUID {
    state BACKUP
    interface eth0
    virtual_router_id 51
    priority 90
    advert_int 1

    unicast_src_ip 172.30.0.22
    unicast_peer {
        172.30.0.21
    }

    virtual_ipaddress {
        172.30.0.100/24 dev eth0
    }

    track_script {
        chk_haproxy
    }
}
