# keepalived — MASTER 节点 (priority 100)
vrrp_script chk_haproxy {
    # pkill 来自 procps(Dockerfile 直接安装)。原先的 killall 来自 psmisc,
    # 而 psmisc 只是 procps 的 Recommends —— 一旦加 --no-install-recommends 就消失,
    # 脚本 exit 127 静默失效。用 pkill 消除这个隐性依赖。
    script "/usr/bin/pkill -0 -x haproxy"
    interval 2
    # 必须 -20 而不是 -10: 100-10=90 与 BACKUP 的 90 相等,VRRP 平级不抢占
    # (BACKUP 仅在收到「优先级低于自己」的通告时才抢占),VIP 不会漂移。
    # 实测: weight -10 时 haproxy 挂掉 VIP 仍留在 node1;weight -20 才漂移。
    weight -20
    fall 2
    rise 2
}

vrrp_instance VI_SQUID {
    state MASTER
    interface eth0
    virtual_router_id 51
    priority 100
    advert_int 1

    # Docker bridge 不支持组播,用单播
    unicast_src_ip 172.30.0.21
    unicast_peer {
        172.30.0.22
    }

    virtual_ipaddress {
        172.30.0.100/24 dev eth0
    }

    track_script {
        chk_haproxy
    }
}
