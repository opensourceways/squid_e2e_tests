# Squid 缓存配置 — HTTP 代理 + HTTPS SSL Bump 缓存
#
# 两个监听端口:
#   3128 — 直连口。给容器内调试、以及不经过 HAProxy 的访问用。
#   3129 — HAProxy 专用口,要求对端携带 PROXY protocol 头。
#
# 为什么需要 3129: HAProxy 是 TCP 模式转发,Squid 看到的对端永远是 HAProxy 节点
# (172.30.0.21/.22),access.log 里所有请求的客户端都是这两个 IP,
# 无法按 worker / job / 工具归因,基于客户端 IP 的 ACL 也全部失效。
# 让 HAProxy 用 send-proxy-v2 把真实客户端地址透传过来即可还原。
#
# 单独开一个端口而不是直接给 3128 加 require-proxy-header,是为了不破坏直连调试:
# 加了之后任何不带 PROXY 头的连接都会被拒。
http_port 3128 ssl-bump \
  cert=/etc/squid/certs/squid-ca.pem \
  generate-host-certificates=on \
  dynamic_cert_mem_cache_size=4MB

http_port 3129 require-proxy-header ssl-bump \
  cert=/etc/squid/certs/squid-ca.pem \
  generate-host-certificates=on \
  dynamic_cert_mem_cache_size=4MB

# 只信任 HAProxy 两个节点发来的 PROXY 头 —— 否则任何容器都能伪造源地址,
# 既污染日志也能绕过基于客户端 IP 的 ACL。
acl haproxy_nodes src 172.30.0.21 172.30.0.22
proxy_protocol_access allow haproxy_nodes
proxy_protocol_access deny all

# SSL 证书动态生成助手
sslcrtd_program /usr/lib/squid/security_file_certgen -s /var/spool/squid/ssl_db -M 4MB

# SSL Bump: 解密所有 HTTPS
# ⚠️ 警告: `bump all` 解密全部 HTTPS 流量,仅用于本测试环境。
#    生产环境禁止无差别解密——存在隐私/合规风险(部分国家/行业属违法)。
#    生产应改为白名单模式。注意 `step1` 不是内置 ACL,必须先定义,否则配置解析失败:
#      acl step1 at_step SslBump1
#      acl cacheable_sites ssl::server_name .repo.openeuler.org .curl.se
#      ssl_bump peek step1
#      ssl_bump bump cacheable_sites
#      ssl_bump splice all
#    (可直接参考 PR#3 squid-rpardini/chart/templates/configmap.yaml 中已验证的写法)
ssl_bump bump all

# DNS（Docker 内 DNS 不可靠,直接用公共 DNS）
dns_nameservers 8.8.8.8 1.1.1.1

# ACL: 允许所有代理请求
# 注意: `all` 是 Squid 内置 ACL,重复定义会触发
#   "WARNING: You should probably remove '::/0' from the ACL named 'all'"
# 直接用内置的即可,不要自己再 acl all src all。
http_access allow all

# 必须显式设置,原因同 haproxy.cfg 的 maxconn:
# Squid 按 RLIMIT_NOFILE 分配 fd 表,Docker 默认 LimitNOFILE=infinity
# (容器内 ulimit -n = 1073741816),导致启动即
#   FATAL: xcalloc: Unable to allocate 1073741816 blocks of 432 bytes!
# 是否触发取决于宿主机 ulimit,在软限制小的机器上不复现,因此极易漏掉。
# (PR#2 的 k8s configmap 已经踩过并设了同样的值)
max_filedescriptors 4096

# 磁盘缓存
cache_dir aufs /var/spool/squid 10000 16 256
cache_mem 256 MB
maximum_object_size 512 MB

# 缓存效率 —— 取值对齐 PR#3 chart 中已在集群验证过的配置
# 默认 512KB,不显式设置的话 cache_mem 对 RPM/tarball 这类对象完全用不上
maximum_object_size_in_memory 512 KB
# N 个 CI worker 同时首次拉同一个包时只回源一次,其余等这一份(避免惊群)
collapsed_forwarding on
# 客户端中途断开也把对象下完入缓存。默认行为会丢弃一个快下完的大包,
# 而 CI 场景「下到一半被 job 取消」很常见,下次仍然 MISS
quick_abort_min -1 KB
quick_abort_max -1 KB
# Range 请求(如 dnf 分段取包)也完整回源并缓存,否则 Range 永远不进缓存
range_offset_limit none
# LFUDA 最大化字节命中率(省出向带宽),GDSF 最大化对象命中率(省 IOPS)
cache_replacement_policy heap LFUDA
memory_replacement_policy heap GDSF

# 缓存策略
refresh_pattern . 1440 50% 4320 override-expire

# 日志
access_log daemon:/var/log/squid/access.log squid
cache_log /var/log/squid/cache.log
coredump_dir /var/spool/squid
