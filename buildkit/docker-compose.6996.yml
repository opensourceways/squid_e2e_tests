# BuildKit daemon —— 基于上游 PR #6996(env 变量式上游代理)的验证部署
# 与 docker-compose.buildkit.yml 的区别:
#   - 镜像: 从 gmarmstrong/buildkit@proxy-chaining 编译
#   - 上游代理配置从 buildkitd.toml 的 [proxy] 段 → buildkitd 进程环境变量
#   - CA 信任从 upstreamCACert 显式配置 → 系统信任库(SSL_CERT_FILE)
#
# 对照组用法: 把 SSL_CERT_FILE 这行注释掉再 up, HTTPS 下载应因证书校验失败
# (证明无 cert 配置时, CA 必须预置进系统信任库, 这是 PR #6996 的关键限制)

services:
  buildkitd:
    image: tommylike/buildkit-6996:test
    container_name: buildkitd
    entrypoint: ["buildkitd", "--addr", "tcp://0.0.0.0:1234", "--config", "/etc/buildkit/buildkitd.toml"]
    environment:
      # 上游代理 = Squid HA VIP(PR #6996: 从 buildkitd 环境读取)
      HTTP_PROXY: "http://172.30.0.100:3128"
      HTTPS_PROXY: "http://172.30.0.100:3128"
      http_proxy: "http://172.30.0.100:3128"
      https_proxy: "http://172.30.0.100:3128"
      NO_PROXY: "localhost,127.0.0.1,172.30.0.0/24"
      no_proxy: "localhost,127.0.0.1,172.30.0.0/24"
      # PR #6996 无 cert 配置 → 信任下沉到系统信任库。Go x509 会读 SSL_CERT_FILE,
      # 把 Squid SSL-Bump CA 加进内建代理出站连接的系统证书池。
      # (对照组: 注释此行 → HTTPS 经 bump Squid 应证书校验失败)
      SSL_CERT_FILE: "/etc/buildkit/squid-ca.pem"
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
      - NET_RAW
      - SETUID
      - SETGID
      - MKNOD
      - SYS_CHROOT
      - DAC_OVERRIDE
      - CHOWN
      - FOWNER
      - FSETID
      - SETPCAP
      - SETFCAP
      - KILL
      - SYS_PTRACE
      - NET_BIND_SERVICE
      - AUDIT_WRITE
    security_opt:
      - apparmor=unconfined
      - seccomp=unconfined
      - systempaths=unconfined
    cgroup: host
    networks:
      squid_net:
        ipv4_address: 172.30.0.30
    volumes:
      - ./buildkitd-6996.toml:/etc/buildkit/buildkitd.toml:ro
      - ../configs/certs/client-ca.crt:/etc/buildkit/squid-ca.pem:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

networks:
  squid_net:
    external: true
    name: haproxy_ha_squid_net
