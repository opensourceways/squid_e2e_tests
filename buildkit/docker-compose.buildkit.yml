# BuildKit daemon —— 接入现有 Squid HA 网络,rootful + 精简 capabilities(不用 privileged)
# 与主 docker-compose.yml 共用外部网络 haproxy_ha_squid_net

services:
  buildkitd:
    # 预构建镜像(从 PR feature/upstream-proxy-config 编译并推送)
    # 如需自行构建见 buildkit/image/README.md
    image: tommylike/buildkit-upstream-proxy:latest
    container_name: buildkitd
    entrypoint: ["buildkitd", "--addr", "tcp://0.0.0.0:1234", "--config", "/etc/buildkit/buildkitd.toml"]
    # 最小 capabilities: 先 drop 全部,再精确添加(见 DESIGN.md 权限设计)
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN      # 挂载 overlayfs + 创建 mount/net/pid namespace(不可避免)
      - NET_ADMIN      # 配置 RUN 沙箱与 proxy netns 的 veth/netlink
      - NET_RAW        # 沙箱网络原始套接字
      - SETUID         # RUN 内切换用户
      - SETGID
      - MKNOD          # 创建设备节点
      - SYS_CHROOT     # chroot 到 rootfs
      - DAC_OVERRIDE   # 文件权限
      - CHOWN
      - FOWNER
      - FSETID
      - SETPCAP
      - SETFCAP
      - KILL
      - SYS_PTRACE          # runc mount remapping 需 open 容器 init 的 /proc/<pid>/ns/mnt
      - NET_BIND_SERVICE    # RUN 容器默认 cap 集之一(bounding set 须含,否则 runc 无法授予)
      - AUDIT_WRITE         # 同上,RUN 容器默认 cap
    security_opt:
      - apparmor=unconfined     # overlayfs/namespace 操作需要;非 privileged
      - seccomp=unconfined      # runc mount remapping / setns 需要;默认 seccomp 会拦截
      - systempaths=unconfined  # 解除 /proc 屏蔽路径;runc 需访问 /proc/<pid>/ns
    # BuildKit 的 RUN 需要写 cgroup 子树;非 privileged 容器 /sys/fs/cgroup 默认只读,
    # 故共享 host cgroup namespace + 可写挂载(这是相对 privileged 的最小必要补充)
    cgroup: host
    networks:
      squid_net:
        ipv4_address: 172.30.0.30
    volumes:
      - ./buildkitd.toml:/etc/buildkit/buildkitd.toml:ro
      - ../configs/certs/client-ca.crt:/etc/buildkit/squid-ca.pem:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

networks:
  squid_net:
    external: true
    name: haproxy_ha_squid_net
