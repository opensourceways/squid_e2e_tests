            while true; do\n  LAST=$(stat -c %Y \"$HEARTBEAT_FILE\" 2>/dev/null ||\
            \ stat -f %m \"$HEARTBEAT_FILE\")\n  NOW=$(date +%s)\n  ELAPSED=$((NOW\
