            \ echo \"WARNING: git config failed for codehub\"\n\ntrap 'EXIT_CODE=$?;\
            \ [ \"$EXIT_CODE\" -ne 0 ] && sleep 10' EXIT\n{\n    set +e\n    echo\
            \ \"===== System Info =====\"\n    echo \"===== OS =====\"\n    uname\
            \ -a\n    human_bytes() {\n        local bytes=$1\n        case \"$bytes\"\
            \ in\n            max|-1) echo \"unlimited\"; return ;;\n        esac\n\
            \        if [ \"${bytes#-}\" != \"$bytes\" ]; then\n            echo \"\
            unlimited\"\n            return\n        fi\n        if [ \"$bytes\" -ge\
            \ 1073741824 ]; then\n            echo \"$((bytes / 1073741824))GiB\"\n\
            \        elif [ \"$bytes\" -ge 1048576 ]; then\n            echo \"$((bytes\
            \ / 1048576))MiB\"\n        elif [ \"$bytes\" -ge 1024 ]; then\n     \
            \       echo \"$((bytes / 1024))KiB\"\n        else\n            echo\
            \ \"${bytes}B\"\n        fi\n    }\n    echo \"===== CPU =====\"\n   \
            \ req_cores=\"\"\n    if [ -r /sys/fs/cgroup/cpu.weight ]; then\n    \
            \    weight=$(cat /sys/fs/cgroup/cpu.weight)\n        if [ -n \"$weight\"\
            \ ] && [ \"$weight\" -gt 1 ] 2>/dev/null; then\n            req_cores=$((\
            \ ( ( (weight - 1) * 262142 / 9999 + 2 ) * 1000 / 1024 + 500 ) / 1000\
            \ ))\n        fi\n    elif [ -r /sys/fs/cgroup/cpu/cpu.shares ]; then\n\
            \        shares=$(cat /sys/fs/cgroup/cpu/cpu.shares)\n        if [ -n\
            \ \"$shares\" ] && [ \"$shares\" -gt 2 ] 2>/dev/null; then\n         \
            \   req_cores=$(( ( shares * 1000 / 1024 + 500 ) / 1000 ))\n        fi\n\
            \    fi\n    if [ -n \"$req_cores\" ]; then\n        echo \"CPU request:\
            \ ${req_cores} cores\"\n    fi\n    if [ -r /sys/fs/cgroup/cpu.max ];\
            \ then\n        read -r quota period < /sys/fs/cgroup/cpu.max\n      \
            \  if [ \"$quota\" != \"max\" ] && [ -n \"$period\" ] && [ \"$period\"\
            \ != \"0\" ]; then\n            echo \"CPU limit: $((quota / period))\
            \ cores\"\n        fi\n    elif [ -r /sys/fs/cgroup/cpu/cpu.cfs_quota_us\
            \ ] && [ -r /sys/fs/cgroup/cpu/cpu.cfs_period_us ]; then\n        quota=$(cat\
            \ /sys/fs/cgroup/cpu/cpu.cfs_quota_us)\n        period=$(cat /sys/fs/cgroup/cpu/cpu.cfs_period_us)\n\
            \        if [ \"$quota\" != \"-1\" ] && [ -n \"$period\" ] && [ \"$period\"\
            \ != \"0\" ]; then\n            echo \"CPU limit: $((quota / period))\
            \ cores\"\n        fi\n    fi\n    if [ -r /sys/fs/cgroup/cpu.stat ];\
            \ then\n        t1=$(grep '^usage_usec ' /sys/fs/cgroup/cpu.stat | cut\
            \ -d ' ' -f2)\n        sleep 1\n        t2=$(grep '^usage_usec ' /sys/fs/cgroup/cpu.stat\
            \ | cut -d ' ' -f2)\n        if [ -n \"$t1\" ] && [ -n \"$t2\" ] && [\
            \ \"$t2\" -ge \"$t1\" ] 2>/dev/null; then\n            echo \"CPU usage:\
            \ $(awk -v d=\"$((t2 - t1))\" 'BEGIN { printf \"%.2f cores\", d / 1000000\
            \ }')\"\n        fi\n    elif [ -r /sys/fs/cgroup/cpuacct/cpuacct.usage\
            \ ]; then\n        n1=$(cat /sys/fs/cgroup/cpuacct/cpuacct.usage)\n  \
            \      sleep 1\n        n2=$(cat /sys/fs/cgroup/cpuacct/cpuacct.usage)\n\
            \        if [ -n \"$n1\" ] && [ -n \"$n2\" ] && [ \"$n2\" -ge \"$n1\"\
            \ ] 2>/dev/null; then\n            echo \"CPU usage: $(awk -v d=\"$((n2\
            \ - n1))\" 'BEGIN { printf \"%.2f cores\", d / 1000000000 }')\"\n    \
            \    fi\n    fi\n    echo \"===== Memory =====\"\n    if [ -r /sys/fs/cgroup/memory.max\
            \ ]; then\n        echo \"Memory limit: $(human_bytes \"$(cat /sys/fs/cgroup/memory.max)\"\
            )\"\n        if [ -r /sys/fs/cgroup/memory.current ]; then\n         \
            \   echo \"Memory usage: $(human_bytes \"$(cat /sys/fs/cgroup/memory.current)\"\
            )\"\n        fi\n    elif [ -r /sys/fs/cgroup/memory/memory.limit_in_bytes\
            \ ]; then\n        echo \"Memory limit: $(human_bytes \"$(cat /sys/fs/cgroup/memory/memory.limit_in_bytes)\"\
            )\"\n        if [ -r /sys/fs/cgroup/memory/memory.usage_in_bytes ]; then\n\
            \            echo \"Memory usage: $(human_bytes \"$(cat /sys/fs/cgroup/memory/memory.usage_in_bytes)\"\
            )\"\n        fi\n    else\n        free -h\n    fi\n    echo \"===== NPU\
            \ =====\"\n    if command -v npu-smi >/dev/null 2>&1; then\n        npu-smi\
            \ info\n    else\n        echo \"npu-smi not available\"\n    fi\n} 2>/dev/null\
            \ || true\nif [ -n \"https://gitcode.com/Ascend/VisionSDK.git\" ]; then\n\
            \    CLONE_OK=true\n    git clone --single-branch -b \"master\" \"https://gitcode.com/Ascend/VisionSDK.git\"\
            \ \"$WORKSPACE\" || {\n        mkdir \"$WORKSPACE\" || echo \"WARNING:\
            \ directory exists\"\n        echo \"WARNING: 主项目拉取失败！\"\n        CLONE_OK=false\n\
            \    }\n    cd \"$WORKSPACE\"\n    if [ \"$CLONE_OK\" = \"true\" ]; then\n\
            \        git fetch origin +refs/merge-requests/61/head:pr\n        git\
            \ config --global user.name \"robot\"\n        git config --global user.email\
            \ \"your@emaple.com\"\n        git merge pr --no-ff -m \"Merge master\
            \ from refs/merge-requests/61/head\" || {\n            echo \"WARNING:\
            \ 主项目merge失败！\"\n        }\n    fi\nfi\ncat > .bazelrc << 'EOF'\n# Use\
            \ GitHub BCR source as the registry\ncommon --registry=https://gh-proxy.test.osinfra.cn/https://raw.githubusercontent.com/bazelbuild/bazel-central-registry/main/\n\
            EOF\nset -e\necho 'hello'\nrm -rf ./* .git\ngit clone -b master --depth=1\
            \ https://gitcode.com/Ascend/VisionSDK.git VisionSDK\ncd VisionSDK\nls\
            \ -al ./\ngit fetch origin refs/merge-requests/61/head\ngit checkout FETCH_HEAD\
            \ -b new_master\ngit diff master --no-commit-id --name-only > /workspace/change.txt\n\
            ls -la ./\ncat /workspace/change.txt\ncd /workspace\n# git clone -b master\
            \ https://AtlasAccount:${Atlas_password}@gitcode.com/Ascend/MindSDK-CI.git\
            \ ci\n\necho 'pr_id：61'\n\nBASE_PATH=\"obs://mindx-package/Private_Repository/VisionSDK/61\"\
            \necho \"初始路径：${BASE_PATH}\"\n\nwget https://mindx-package.obs.cn-north-4.myhuaweicloud.com/Private_Repository/VisionSDK/61/master_ci.tar.gz\n\
            mkdir -p /workspace/ci\ntar -zxvf master_ci.tar.gz\nmv /workspace/master_ci/*\
            \ /workspace/ci/\n# FULL_PATH=${BASE_PATH}/ci\n# obsutil cp ${FULL_PATH}/\
            \ ./ -e=obs.cn-north-4.myhuaweicloud.com -r -f\n\necho '展示ci文件'\nls -la\
            \ /workspace\necho '展示ci文件2'\nls -la /workspace/ci\n\n#下载依赖\nmkdir -p\
            \ /home/simon\ncd /home/simon\nwget https://mindcluster.obs.cn-north-4.myhuaweicloud.com/omcode_bak/models.tar.gz\
            \ \ntar -zxvf models.tar.gz\necho 'models.tar.gz'\nls -la /home/simon\n\
            mkdir -p /home/buildtools\ncd /home/buildtools\nwget https://mindcluster.obs.cn-north-4.myhuaweicloud.com/blueImageDependency/mindspore-lite-2.4.0-linux-aarch64.tar.gz\n\
            tar -zxvf mindspore-lite-2.4.0-linux-aarch64.tar.gz\necho 'mindspore-lite'\n\
            ls -la /home/buildtools/mindspore-lite-2.4.0-linux-aarch64\n\ncd /workspace\n\
            #编译\necho \"[INFO]:开始编译......\"\ncd ci/visionsdk && bash prepare_dependency.sh\n\
            wget -O /workspace/VisionSDK/opensource-device-arm-gcc4.tar.gz https://mindcluster.obs.cn-north-4.myhuaweicloud.com/opensource-device-arm-gcc4.tar.gz\n\
            wget -O /workspace/VisionSDK/opensource-arm-gcc4.tar.gz https://mindcluster.obs.cn-north-4.myhuaweicloud.com/opensource-arm-gcc4.tar.gz\n\
            # obsutil cp obs://mindcluster/opensource-device-arm-gcc4.tar.gz /workspace/VisionSDK/opensource-device-arm-gcc4.tar.gz\n\
            # obsutil cp obs://mindcluster/opensource-arm-gcc4.tar.gz /workspace/VisionSDK/opensource-arm-gcc4.tar.gz\n\
            \napt install pkg-config\napt install -y libcapture-tiny-perl\napt install\
            \ -y libdatetime-perl\ncd /workspace/\nwget https://github.com/linux-test-project/lcov/releases/download/v2.0/lcov-2.0.tar.gz\n\
            tar -xzf lcov-2.0.tar.gz && cd lcov-2.0\nmake install\n# git clone https://gitcode.com/gh_mirrors/lc/lcov.git\n\
            # cd lcov\n# git checkout v2.1\n# sudo make install PREFIX=/usr/local\n\
            # export PATH=/usr/local/bin:$PATH\n# apt install -y libdatetime-perl\n\
            ls -al /workspace/VisionSDK/\ncd /workspace/VisionSDK/ && bash build_all.sh\
            \ arm-gcc4 aarch64 test\n\n"
