            \ echo \"WARNING: git config failed for github\"\ngit config --global\
            \ url.\"http://git-cache-github.git-cache.svc.cluster.local:8080\".insteadOf\
            \ \"https://github.com\" || echo \"WARNING: git config failed for github\"\
            \ngit config --global url.\"http://git-cache-gitee.git-cache.svc.cluster.local:8080\"\
            .insteadOf \"https://gitee.com\" || echo \"WARNING: git config failed\
            \ for gitee\"\ngit config --global url.\"http://git-cache-atomgit.git-cache.svc.cluster.local:8080\"\
            .insteadOf \"https://atomgit.com\" || echo \"WARNING: git config failed\
            \ for atomgit\"\ngit config --global url.\"http://git-cache-codehub.git-cache.svc.cluster.local:8080\"\
