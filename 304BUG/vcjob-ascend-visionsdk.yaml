            \  continue\n        fi\n        CG=$(awk -F/ '{print $NF}' /proc/$pid/cgroup\
            \ 2>/dev/null | head -1)\n        if [ \"$CG\" != \"$MY_CGROUP\" ]; then\n\
            \          kill -9 \"$pid\" 2>/dev/null || true\n        fi\n      done\n\
            \      sleep 2\n    done\n    echo \"Killing PID 1.\"\n    kill -9 1 2>/dev/null\
            \ || true\n    exit 1\n  fi\n  COUNT=$((COUNT + 1))\n  if [ $((COUNT %\
            \ 5)) -eq 0 ]; then\n    REMAINING=$((TIMEOUT_SEC - ELAPSED))\n    echo\
            \ \"Heartbeat remaining: ${REMAINING}s\"\n  fi\n  sleep 1\ndone"
