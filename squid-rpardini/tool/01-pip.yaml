apiVersion: batch.volcano.sh/v1alpha1
kind: Job
metadata:
  generateName: test-squid-pip-
  namespace: squid
  labels:
    kubernetes.io/arch: arm64
    pipeline/run-id: test-squid-pip
spec:
  policies:
    - event: PodFailed
      action: AbortJob
  queue: shared-flexible-queue
  maxRetry: 1
  minAvailable: 1
  ttlSecondsAfterFinished: 1800
  tasks:
    - name: test-squid-pip
      replicas: 1
      maxRetry: 1
      template:
        spec:
          containers:
            - name: test
              image: swr.cn-southwest-2.myhuaweicloud.com/modelfoundry/ubuntu:24.04
              command:
                - bash
                - -c
              args:
                - |
                  #!/bin/bash
                  set -e
                  sed -i 's|http://ports.ubuntu.com/ubuntu-ports|http://mirrors.huaweicloud.com/ubuntu-ports|g' \
                    /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2>/dev/null || true
                  apt-get update -qq 2>&1 | tail -2 || true
                  apt-get install -y -qq python3 python3-pip curl 2>&1 | tail -3 || { apt-get update -qq 2>&1 | tail -2 || true; apt-get install -y -qq python3 python3-pip curl 2>&1 | tail -3; }
                  T_START=$(date +%s%3N)

                  echo ""
                  echo "=========================================="
                  echo "Scenario 1: pip install through proxy"
                  echo "=========================================="

                  echo "--- install packages (cold fetch) ---"
                  echo -n "pip install requests (pypi.org)     → "
                  pip install --quiet --break-system-packages -i https://mirrors.huaweicloud.com/repository/pypi/simple requests 2>&1 | tail -1
                  echo "✅"

                  echo -n "pip install pyyaml (tsinghua)       → "
                  pip install --quiet --break-system-packages \
                    --index-url https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple \
                    pyyaml 2>&1 | tail -1
                  echo "✅"

                  echo -n "pip install pytest (huaweicloud)    → "
                  pip install --quiet --break-system-packages \
                    --index-url https://repo.huaweicloud.com/repository/pypi/simple \
                    pytest 2>&1 | tail -1
                  echo "✅"

                  echo ""
                  echo "=========================================="
                  echo "Real-world requirements: vllm-project/vllm-ascend"
                  echo "=========================================="
                  echo "--- fetching requirements.txt (via proxy, jsdelivr CDN mirror —"
                  echo "    raw.githubusercontent.com hits a known squid github-rewrite.py bug:"
                  echo "    it rewrites the URL for an already-open bumped-TLS connection to the"
                  echo "    real github host, corrupting the Host header → GitHub 404) ---"
                  curl -s -o /tmp/vllm-ascend-requirements.txt \
                    https://cdn.jsdelivr.net/gh/vllm-project/vllm-ascend@main/requirements.txt
                  wc -l /tmp/vllm-ascend-requirements.txt

                  echo ""
                  echo "=========================================="
                  echo "Bandwidth test: torch==2.10.0 wheel (real vllm-ascend dependency)"
                  echo "cp311-manylinux_2_28-aarch64, ~146MB, via huaweicloud pypi mirror"
                  echo "(files.pythonhosted.org itself is confirmed extremely slow/unreliable"
                  echo " from this cluster — a 2.9MB file took 160s and aborted in testing;"
                  echo " huaweicloud's mirror is what a real China-based CI would use anyway)"
                  echo "=========================================="
                  TORCH_URL="https://repo.huaweicloud.com/repository/pypi/packages/78/89/f5554b13ebd71e05c0b002f95148033e730d3f7067f67423026cc9c69410/torch-2.10.0-cp311-cp311-manylinux_2_28_aarch64.whl"
                  echo "--- fetch torch wheel (single run, direct vs squid) ---"
                  curl -s -o /dev/null \
                    -w 'pip bandwidth: HTTP=%{http_code} size=%{size_download}bytes time=%{time_total}s speed=%{speed_download}B/s\n' \
                    "$TORCH_URL"

                  echo ""
                  echo "--- bulk pip download: whole requirements.txt as ONE command"
                  echo "    (index=huaweicloud; torch/torchvision/torchaudio excluded —"
                  echo "     already measured above). pip aborts the WHOLE batch if even"
                  echo "     one requirement is unresolvable, so we retry a few times,"
                  echo "     dropping only the specific package(s) pip complains about,"
                  echo "     until the rest resolve as a single aggregate download ---"
                  BULK_INDEX="https://repo.huaweicloud.com/repository/pypi/simple"
                  grep -vE '^\s*(#|$)' /tmp/vllm-ascend-requirements.txt | sed 's/#.*//' \
                    | grep -vE '^(torch|torchvision|torchaudio)\b' > /tmp/reqs-try.txt

                  mkdir -p /tmp/wheels
                  ATTEMPT=0
                  while [ $ATTEMPT -lt 6 ]; do
                    ATTEMPT=$((ATTEMPT+1))
                    rm -rf /tmp/wheels; mkdir -p /tmp/wheels
                    T0=$(date +%s%3N)
                    if pip download --no-deps --no-cache-dir --index-url "$BULK_INDEX" \
                         -d /tmp/wheels -r /tmp/reqs-try.txt > /tmp/bulkdl.log 2>&1; then
                      T1=$(date +%s%3N)
                      break
                    fi
                    T1=$(date +%s%3N)
                    BAD=$(grep -oE "requirement [A-Za-z0-9_.-]+" /tmp/bulkdl.log | awk '{print $2}' | sort -u)
                    if [ -z "$BAD" ]; then
                      echo "bulk download failed, could not identify bad package(s):"
                      tail -15 /tmp/bulkdl.log
                      break
                    fi
                    echo "attempt $ATTEMPT: excluding unresolvable package(s): $BAD"
                    for b in $BAD; do
                      grep -viE "^${b}([<>=! ]|\$)" /tmp/reqs-try.txt > /tmp/reqs-try.txt.new \
                        && mv /tmp/reqs-try.txt.new /tmp/reqs-try.txt
                    done
                  done

                  BYTES=$(du -sb /tmp/wheels 2>/dev/null | awk '{print $1}')
                  COUNT=$(ls /tmp/wheels 2>/dev/null | wc -l)
                  MS=$((T1 - T0))
                  echo "bulk pip download (attempt $ATTEMPT): $COUNT files, ${BYTES:-0} bytes, ${MS}ms"
                  if [ "${BYTES:-0}" -gt 0 ] && [ "$MS" -gt 0 ]; then
                    echo "aggregate bandwidth: $(( BYTES * 1000 / MS )) B/s"
                  fi

                  echo ""
                  echo "=========================================="
                  T_END=$(date +%s%3N)
                  echo "DURATION: $((T_END - T_START))ms"
                  echo "✅ Scenario 1 completed."
                  echo "=========================================="
              lifecycle:
                postStart:
                  exec:
                    command:
                      - /bin/bash
                      - -c
                      - |
                        set +e

                        # Bazel JVM trust: point JVM at the mounted squid-CA keystore
                        # (Bazel ignores JAVA_TOOL_OPTIONS; args must come via .bazelrc)
                        cat > "$WORKSPACE/.bazelrc" << 'EOF'
                        common --noenable_bzlmod
                        common --registry=https://gh-proxy.test.osinfra.cn/https://raw.githubusercontent.com/bazelbuild/bazel-central-registry/main/
                        build --cxxopt=-std=c++17
                        startup --host_jvm_args=-Djavax.net.ssl.trustStore=/etc/squid-bazel-trust/squid-bazel-trust.jks
                        startup --host_jvm_args=-Djavax.net.ssl.trustStorePassword=changeit
                        EOF

                        P=/etc/squid-ca/squid-ca.pem
                        if [ -f "$P" ]; then
                          if [ -d /etc/pki/ca-trust/source/anchors ]; then
                            cp "$P" /etc/pki/ca-trust/source/anchors/squid-ca.pem >/dev/null 2>&1
                            update-ca-trust extract >/dev/null 2>&1
                          else
                            cp "$P" /usr/local/share/ca-certificates/squid-ca.crt >/dev/null 2>&1
                            update-ca-certificates -f >/dev/null 2>&1
                          fi
                        fi

                        if command -v apt-get >/dev/null 2>&1 && [ -n "$HTTPS_PROXY" ]; then
                          mkdir -p /etc/apt/apt.conf.d
                          printf 'Acquire::http::Proxy "http://squid-cache.squid.svc.cluster.local:3128";\nAcquire::https::Proxy "http://squid-cache.squid.svc.cluster.local:3128";\n' > /etc/apt/apt.conf.d/99squid-proxy
                        fi

                        exit 0
              workingDir: /workspace
              resources:
                limits:
                  cpu: "2"
                  memory: 2Gi
                requests:
                  cpu: "2"
                  memory: 2Gi
              env:
                - name: WORKSPACE
                  value: /workspace
                - name: HTTP_PROXY
                  value: "http://squid-cache.squid.svc.cluster.local:3128"
                - name: HTTPS_PROXY
                  value: "http://squid-cache.squid.svc.cluster.local:3128"
                - name: http_proxy
                  value: "http://squid-cache.squid.svc.cluster.local:3128"
                - name: https_proxy
                  value: "http://squid-cache.squid.svc.cluster.local:3128"
                - name: NO_PROXY
                  value: "localhost,127.0.0.1,.buildkitd,.svc.cluster.local,.cluster.local"
                - name: no_proxy
                  value: "localhost,127.0.0.1,.buildkitd,.svc.cluster.local,.cluster.local"
                - name: SSL_CERT_FILE
                  value: /etc/squid-ca/squid-ca.pem
                - name: CURL_CA_BUNDLE
                  value: /etc/squid-ca/squid-ca.pem
                - name: REQUESTS_CA_BUNDLE
                  value: /etc/squid-ca/squid-ca.pem
                - name: GIT_SSL_CAINFO
                  value: /etc/squid-ca/squid-ca.pem
                - name: PIP_CERT
                  value: /etc/squid-ca/squid-ca.pem
                - name: NODE_EXTRA_CA_CERTS
                  value: /etc/squid-ca/squid-ca.pem
              volumeMounts:
                - name: squid-ca
                  mountPath: /etc/squid-ca
                  readOnly: true
          volumes:
            - name: squid-ca
              secret:
                secretName: squid-ca-cert
                items:
                  - key: squid-ca.pem
                    path: squid-ca.pem
                optional: true
          nodeSelector:
            kubernetes.io/arch: arm64
          imagePullSecrets:
            - name: huawei-swr-image-pull-secret-model-gy
          activeDeadlineSeconds: 2400
          securityContext:
            runAsUser: 0
          restartPolicy: Never
