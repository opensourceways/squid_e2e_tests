# cache_peer 基线对照 vcjob（with-squid 变体）：apt / pip / go 走 squid 代理
#
# 配套 direct 变体由 .gen-direct.py 生成（剥离代理 env → 走 pod 默认路由）：
#   python3 .gen-direct.py apt-pip-go-compare-vcjob.yaml apt-pip-go-compare-vcjob-direct.yaml
#
# 用法（gy-006，两个变体分别 apply，可并行跑）：
#   kubectl --kubeconfig ~/.kube/gy-006.yaml apply -f apt-pip-go-compare-vcjob.yaml
#   kubectl --kubeconfig ~/.kube/gy-006.yaml apply -f apt-pip-go-compare-vcjob-direct.yaml
#   kubectl --kubeconfig ~/.kube/gy-006.yaml get pods -n squid -l pipeline/run-id=cachepeer-compare -w
#   kubectl --kubeconfig ~/.kube/gy-006.yaml logs -n squid <pod>
#   kubectl --kubeconfig ~/.kube/gy-006.yaml exec -n squid squid-cache-0 -c squid -- \
#     grep -E "ubuntu|pypi|golang" /var/log/squid/access.log | tail -40
#
# 执行时机：P2（cache_peer 部署）前后各跑一轮同一对 yaml —— 对照 HIER 与耗时。
apiVersion: batch.volcano.sh/v1alpha1
kind: Job
metadata:
  generateName: cachepeer-compare-
  labels:
    kubernetes.io/arch: amd64
    pipeline/run-id: cachepeer-compare
  name: cachepeer-apt-pip-go-compare
  namespace: squid
spec:
  maxRetry: 1
  minAvailable: 1
  policies:
  - action: AbortJob
    event: PodFailed
  queue: shared-flexible-queue
  schedulerName: volcano
  tasks:
  # ─────────── task 1: apt（archive.ubuntu.com，走 squid）───────────
  - maxRetry: 1
    minAvailable: 1
    name: apt-squid
    replicas: 1
    template:
      spec:
        activeDeadlineSeconds: 1800
        containers:
        - args:
          - |
            set -e
            PKG=xz-utils
            t() { echo "$(( ( $(date +%s%N) - $1 ) / 1000000 ))"; }
            echo "MODE=$MODE"
            T0=$(date +%s%N)
            apt-get update -qq 2>&1 | tail -2 || true
            echo "apt-get update(squid): $(t $T0) ms"
            for i in 1 2; do
              T0=$(date +%s%N)
              apt-get download "$PKG" -o Dir::Cache=/tmp/apt-squid >/dev/null 2>&1 || true
              echo "apt-get download $PKG pass$i(squid): $(t $T0) ms"
            done
            echo "===== 完成（$MODE）：pass2 应显著快于 pass1（squid HIT）；核对 access.log ====="
            echo "  grep -E 'archive.ubuntu.com' /var/log/squid/access.log | tail"
          command:
          - /bin/bash
          - -c
          env:
          - name: MODE
            value: apt-with-squid
          - name: HTTP_PROXY
            value: http://squid-cache.squid.svc.cluster.local:3128
          - name: HTTPS_PROXY
            value: http://squid-cache.squid.svc.cluster.local:3128
          - name: http_proxy
            value: http://squid-cache.squid.svc.cluster.local:3128
          - name: https_proxy
            value: http://squid-cache.squid.svc.cluster.local:3128
          - name: NO_PROXY
            value: localhost,127.0.0.1,.svc.cluster.local,.cluster.local
          - name: no_proxy
            value: localhost,127.0.0.1,.svc.cluster.local,.cluster.local
          image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann:9.0.0-a3-ubuntu22.04-py3.12
          name: apt
          resources:
            limits: {cpu: '2', memory: 4Gi}
            requests: {cpu: '1', memory: 2Gi}
        imagePullSecrets:
        - name: huawei-swr-image-pull-secret-model-gy
        nodeSelector:
          kubernetes.io/arch: amd64
        restartPolicy: Never
        securityContext:
          runAsUser: 0
  # ─────────── task 2: pip（pypi.org，走 squid）───────────
  - maxRetry: 1
    minAvailable: 1
    name: pip-squid
    replicas: 1
    template:
      spec:
        activeDeadlineSeconds: 1800
        containers:
        - args:
          - |
            set -e
            t() { echo "$(( ( $(date +%s%N) - $1 ) / 1000000 ))"; }
            echo "MODE=$MODE"
            rm -rf /tmp/pip-squid
            for i in 1 2; do
              T0=$(date +%s%N)
              pip download requests==2.31.0 --no-deps -d /tmp/pip-squid --quiet 2>&1 | tail -1 || true
              echo "pip download pass$i(squid): $(t $T0) ms"
            done
            echo "===== 完成（$MODE）：pass2 应命中缓存；核对 access.log ====="
            echo "  grep -E 'pypi.org|pythonhosted' /var/log/squid/access.log | tail"
          command:
          - /bin/bash
          - -c
          env:
          - name: MODE
            value: pip-with-squid
          - name: SSL_CERT_FILE
            value: /etc/squid-ca/squid-ca.pem
          - name: PIP_CERT
            value: /etc/squid-ca/squid-ca.pem
          - name: HTTP_PROXY
            value: http://squid-cache.squid.svc.cluster.local:3128
          - name: HTTPS_PROXY
            value: http://squid-cache.squid.svc.cluster.local:3128
          - name: http_proxy
            value: http://squid-cache.squid.svc.cluster.local:3128
          - name: https_proxy
            value: http://squid-cache.squid.svc.cluster.local:3128
          - name: NO_PROXY
            value: localhost,127.0.0.1,.svc.cluster.local,.cluster.local
          - name: no_proxy
            value: localhost,127.0.0.1,.svc.cluster.local,.cluster.local
          image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann:9.0.0-a3-ubuntu22.04-py3.12
          name: pip
          lifecycle:
            postStart:
              exec:
                command: ["/bin/sh","-c","set +e; P=/etc/squid-ca/squid-ca.pem; if [ -f \"$P\" ]; then cp \"$P\" /usr/local/share/ca-certificates/squid-ca.crt; update-ca-certificates -f >/dev/null 2>&1; fi; exit 0"]
          resources:
            limits: {cpu: '2', memory: 4Gi}
            requests: {cpu: '1', memory: 2Gi}
          volumeMounts:
          - mountPath: /etc/squid-ca
            name: squid-ca
            readOnly: true
        imagePullSecrets:
        - name: huawei-swr-image-pull-secret-model-gy
        nodeSelector:
          kubernetes.io/arch: amd64
        restartPolicy: Never
        securityContext:
          runAsUser: 0
        volumes:
        - name: squid-ca
          secret:
            items:
            - key: squid-ca.pem
              path: squid-ca.pem
            optional: true
            secretName: squid-ca-cert
  # ─────────── task 3: go（proxy.golang.org，走 squid；无 go 则 curl 线级对照）───────────
  - maxRetry: 1
    minAvailable: 1
    name: go-squid
    replicas: 1
    template:
      spec:
        activeDeadlineSeconds: 1800
        containers:
        - args:
          - |
            set -e
            t() { echo "$(( ( $(date +%s%N) - $1 ) / 1000000 ))"; }
            echo "MODE=$MODE"
            if command -v go >/dev/null 2>&1; then
              mkdir -p /tmp/gomod && cd /tmp/gomod
              printf 'module tmp.example/compare\n\ngo 1.21\n\nrequire golang.org/x/net v0.17.0\n' > go.mod
              for i in 1 2; do
                T0=$(date +%s%N)
                GOPROXY=https://proxy.golang.org,direct go mod download golang.org/x/net 2>&1 | tail -1 || true
                echo "go mod download pass$i(squid): $(t $T0) ms"
              done
            else
              echo "!! 镜像无 go，降级为 curl 线级对照（wire 路径等价）"
              U="https://proxy.golang.org/golang.org/x/net/@v/golang.org/x/net@v0.17.0.mod"
              for i in 1 2 3; do
                T0=$(date +%s%N)
                curl -s "$U" -o /dev/null -w "curl pass$i(squid): code=%{http_code} " --max-time 30 || true
                echo "$(t $T0) ms"
              done
            fi
            echo "===== 完成（$MODE）：核对 access.log 的 MISS/HIT 与 HIER ====="
            echo "  grep -E 'proxy.golang.org' /var/log/squid/access.log | tail"
          command:
          - /bin/bash
          - -c
          env:
          - name: MODE
            value: go-with-squid
          - name: SSL_CERT_FILE
            value: /etc/squid-ca/squid-ca.pem
          - name: HTTP_PROXY
            value: http://squid-cache.squid.svc.cluster.local:3128
          - name: HTTPS_PROXY
            value: http://squid-cache.squid.svc.cluster.local:3128
          - name: http_proxy
            value: http://squid-cache.squid.svc.cluster.local:3128
          - name: https_proxy
            value: http://squid-cache.squid.svc.cluster.local:3128
          - name: NO_PROXY
            value: localhost,127.0.0.1,.svc.cluster.local,.cluster.local
          - name: no_proxy
            value: localhost,127.0.0.1,.svc.cluster.local,.cluster.local
          image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann:9.0.0-a3-ubuntu22.04-py3.12
          name: go
          lifecycle:
            postStart:
              exec:
                command: ["/bin/sh","-c","set +e; P=/etc/squid-ca/squid-ca.pem; if [ -f \"$P\" ]; then cp \"$P\" /usr/local/share/ca-certificates/squid-ca.crt; update-ca-certificates -f >/dev/null 2>&1; fi; exit 0"]
          resources:
            limits: {cpu: '2', memory: 4Gi}
            requests: {cpu: '1', memory: 2Gi}
          volumeMounts:
          - mountPath: /etc/squid-ca
            name: squid-ca
            readOnly: true
        imagePullSecrets:
        - name: huawei-swr-image-pull-secret-model-gy
        nodeSelector:
          kubernetes.io/arch: amd64
        restartPolicy: Never
        securityContext:
          runAsUser: 0
        volumes:
        - name: squid-ca
          secret:
            items:
            - key: squid-ca.pem
              path: squid-ca.pem
            optional: true
            secretName: squid-ca-cert
