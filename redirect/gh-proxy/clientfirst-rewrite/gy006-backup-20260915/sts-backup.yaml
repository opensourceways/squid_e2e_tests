      containers:
      - command:
        - /bin/sh
        - -c
        - |
          # 自建镜像（基于 squid-cache/squid 构建，squid 装到 /usr/local/squid，squid 用户 uid/gid=31）
          # 镜像已内置 squid 及依赖，无需 apk 安装；注意不是官方 squid-cache/squid 镜像。
          # squid 二进制编译默认 cache_log=/var/logs/cache.log（该目录不存在），
          # 必须显式指定到 /var/log/squid 并先建目录，否则 squid -z / squid 启动会失败。
          mkdir -p /var/log/squid
          if [ -f /etc/squid/ssl_cert/squid-ca-bundle.pem ]; then
            if [ ! -d /var/cache/squid-ssl-db ]; then
              /usr/local/squid/libexec/security_file_certgen \
                -c -s /var/cache/squid-ssl-db -M 8MB
              chown -R squid:squid /var/cache/squid-ssl-db 2>/dev/null || true
            fi
          fi

          MISSING=0
          for i in 00 01 02 03 04 05 06 07 08 09 0A 0B 0C 0D 0E 0F; do
            [ -d /var/spool/squid/$i ] || MISSING=1
          done
          if [ "$MISSING" = "1" ]; then
            printf 'cache_dir ufs /var/spool/squid 20480 16 8\npid_filename /tmp/squid-init.pid\ncache_log /var/log/squid/cache.log\n' > /tmp/squid-init.conf
            squid -z -f /tmp/squid-init.conf 2>&1 || true
            rm -f /tmp/squid-init.pid 2>/dev/null || true
          fi

          rm -f /run/squid.pid /var/run/squid.pid /var/run/squid/squid.pid 2>/dev/null || true

          tail -F /var/log/squid/access.log &
          tail -F /var/log/squid/cache.log >&2 &

          exec squid -NYC
