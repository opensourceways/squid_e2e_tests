apiVersion: batch.volcano.sh/v1alpha1
kind: Job
metadata:
  generateName: test-squid-goproxy-
  namespace: squid
  labels:
    kubernetes.io/arch: arm64
    pipeline/run-id: test-squid-goproxy
spec:
  policies:
    - event: PodFailed
      action: AbortJob
  queue: shared-flexible-queue
  maxRetry: 1
  minAvailable: 1
  ttlSecondsAfterFinished: 1800
  tasks:
    - name: test-squid-goproxy
      replicas: 1
      maxRetry: 1
      template:
        spec:
          containers:
            - name: test
              image: swr.cn-southwest-2.myhuaweicloud.com/modelfoundry/ubuntu:24.04
              command:
                - bash
                - -c
              args:
                - |
                  #!/bin/bash
                  set -e

                  echo ""
                  echo "=========================================="
                  echo "Scenario 4: Go module proxy through squid"
                  echo "=========================================="

                  echo "--- Installing git + Go toolchain (zero mirror config) ---"
                  # 零镜像配置：apt 官方源经 squid 重写；ubuntu 24.04 自带 golang-go 1.22，
                  # 满足 GOTOOLCHAIN=auto（>=1.21），无需 aliyun tarball
                  grep -h "URIs: http://ports.ubuntu.com" /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null | head -1
                  apt-get update -qq 2>&1 | tail -2 || true
                  apt-get install -y -qq git curl golang-go 2>&1 | tail -3 || { apt-get update -qq 2>&1 | tail -2 || true; apt-get install -y -qq git curl golang-go 2>&1 | tail -3; }
                  T_START=$(date +%s%3N)

                  go version

                  # GOTOOLCHAIN=auto lets `go` itself download+cache the exact
                  # toolchain go.mod asks for (e.g. go1.26) via GOPROXY — this is
                  # itself a big cacheable download that exercises the proxy.
                  # 零镜像配置：GOPROXY/GOSUMDB 保持默认（proxy.golang.org + sum.golang.org），
                  # squid 重写 proxy.golang.org → goproxy.cn，sumdb 校验路径一并重写
                  go env -w GOTOOLCHAIN=auto
                  echo "GOPROXY  = $(go env GOPROXY)"
                  echo "GOMODCACHE = $(go env GOMODCACHE)"

                  # 本地 golang-go 1.22 太老（GOTOOLCHAIN 解析有缺陷，请求不存在的
                  # v0.0.1-go1.26 字面版本）。真实 CI 的做法：装官方发行版 tarball——
                  # URL 用官方 go.dev/dl（客户端零镜像配置），squid 重写
                  # go.dev/dl + dl.google.com/go → mirrors.aliyun.com/golang（路径同构）
                  GOVER=1.26.0
                  echo "--- install Go $GOVER from official go.dev/dl (squid rewrites) ---"
                  curl -sSLo /tmp/go.tgz --max-time 300 "https://go.dev/dl/go$GOVER.linux-arm64.tar.gz"
                  rm -rf /usr/local/go && tar -C /usr/local -xzf /tmp/go.tgz
                  export PATH=/usr/local/go/bin:$PATH
                  go version

                  echo ""
                  echo "--- git clone mind-cluster (through squid) ---"
                  T0=$(date +%s%3N)
                  git clone --depth 1 https://gitcode.com/Ascend/mind-cluster.git /workspace/mind-cluster 2>&1 | tail -5
                  T1=$(date +%s%3N)
                  echo "git clone took $((T1 - T0))ms"

                  cd /workspace/mind-cluster/component/ascend-operator
                  echo ""
                  echo "--- go.mod (head) ---"
                  cat go.mod | head -3

                  MODCACHE=$(go env GOMODCACHE)

                  echo ""
                  echo "=========================================="
                  echo "go mod tidy (cold — modcache wiped first)"
                  echo "=========================================="
                  go clean -modcache
                  START=$(date +%s%N)
                  go mod tidy
                  END=$(date +%s%N)
                  DURATION=$(( (END - START) / 1000000 ))
                  SIZE1=$(du -sh "$MODCACHE" 2>/dev/null | awk '{print $1}')
                  echo "go mod tidy took ${DURATION}ms"
                  echo "GOMODCACHE size: ${SIZE1}"

                  echo ""
                  echo "--- module count fetched ---"
                  find "$MODCACHE/cache/download" -name "*.info" 2>/dev/null | wc -l | xargs echo "modules downloaded:"

                  echo ""
                  echo "=========================================="
                  T_END=$(date +%s%3N)
                  echo "DURATION: $((T_END - T_START))ms"
                  echo "✅ Scenario 4 completed."
                  echo "=========================================="
              lifecycle:
                postStart:
                  exec:
                    command:
                      - /bin/bash
                      - -c
                      - |
                        set +e

                        # Bazel JVM trust: point JVM at the mounted squid-CA keystore
                        # (Bazel ignores JAVA_TOOL_OPTIONS; args must come via .bazelrc)
                        cat > "$WORKSPACE/.bazelrc" << 'EOF'
                        common --noenable_bzlmod
                        build --cxxopt=-std=c++17
                        startup --host_jvm_args=-Djavax.net.ssl.trustStore=/etc/squid-bazel-trust/squid-bazel-trust.jks
                        startup --host_jvm_args=-Djavax.net.ssl.trustStorePassword=changeit
                        EOF

                        P=/etc/squid-ca/squid-ca.pem
                        if [ -f "$P" ]; then
                          if [ -d /etc/pki/ca-trust/source/anchors ]; then
                            cp "$P" /etc/pki/ca-trust/source/anchors/squid-ca.pem >/dev/null 2>&1
                            update-ca-trust extract >/dev/null 2>&1
                          else
                            cp "$P" /usr/local/share/ca-certificates/squid-ca.crt >/dev/null 2>&1
                            update-ca-certificates -f >/dev/null 2>&1
                          fi
                        fi

                        if command -v apt-get >/dev/null 2>&1 && [ -n "$HTTPS_PROXY" ]; then
                          mkdir -p /etc/apt/apt.conf.d
                          printf 'Acquire::http::Proxy "http://squid-cache.squid.svc.cluster.local:3128";\nAcquire::https::Proxy "http://squid-cache.squid.svc.cluster.local:3128";\n' > /etc/apt/apt.conf.d/99squid-proxy
                        fi

                        exit 0
              workingDir: /workspace
              resources:
                limits:
                  cpu: "4"
                  memory: 6Gi
                requests:
                  cpu: "2"
                  memory: 4Gi
              env:
                - name: WORKSPACE
                  value: /workspace
                - name: HTTP_PROXY
                  value: "http://squid-cache.squid.svc.cluster.local:3128"
                - name: HTTPS_PROXY
                  value: "http://squid-cache.squid.svc.cluster.local:3128"
                - name: http_proxy
                  value: "http://squid-cache.squid.svc.cluster.local:3128"
                - name: https_proxy
                  value: "http://squid-cache.squid.svc.cluster.local:3128"
                - name: NO_PROXY
                  value: "0.0.0.0,localhost,127.0.0.1,.buildkitd,.svc.cluster.local,.cluster.local"
                - name: no_proxy
                  value: "0.0.0.0,localhost,127.0.0.1,.buildkitd,.svc.cluster.local,.cluster.local"

                - name: SSL_CERT_FILE
                  value: /etc/squid-ca/squid-ca.pem
                - name: CURL_CA_BUNDLE
                  value: /etc/squid-ca/squid-ca.pem
                - name: REQUESTS_CA_BUNDLE
                  value: /etc/squid-ca/squid-ca.pem
                - name: GIT_SSL_CAINFO
                  value: /etc/squid-ca/squid-ca.pem
                - name: PIP_CERT
                  value: /etc/squid-ca/squid-ca.pem
                - name: NODE_EXTRA_CA_CERTS
                  value: /etc/squid-ca/squid-ca.pem
              volumeMounts:
                - name: squid-ca
                  mountPath: /etc/squid-ca
                  readOnly: true
                - name: gopath
                  mountPath: /root/go
          volumes:
            - name: squid-ca
              secret:
                secretName: squid-ca-cert
                items:
                  - key: squid-ca.pem
                    path: squid-ca.pem
                optional: true
            - name: gopath
              emptyDir:
                sizeLimit: 10Gi
          nodeSelector:
            kubernetes.io/arch: arm64
          imagePullSecrets:
            - name: huawei-swr-image-pull-secret-model-gy
          activeDeadlineSeconds: 2400
          securityContext:
            runAsUser: 0
          restartPolicy: Never
