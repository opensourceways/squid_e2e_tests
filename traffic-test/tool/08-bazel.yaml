apiVersion: batch.volcano.sh/v1alpha1
kind: Job
metadata:
  generateName: test-squid-bazel-
  namespace: squid
  labels:
    kubernetes.io/arch: arm64
    pipeline/run-id: test-squid-bazel
spec:
  policies:
    - event: PodFailed
      action: AbortJob
  queue: shared-flexible-queue
  maxRetry: 1
  minAvailable: 1
  ttlSecondsAfterFinished: 1800
  tasks:
    - name: test-squid-bazel
      replicas: 1
      maxRetry: 1
      template:
        spec:
          containers:
            - name: test
              image: swr.cn-north-4.myhuaweicloud.com/memfabric-hybrid/memfabric-hybrid_arm:multi_python_v3
              command:
                - bash
                - -c
              args:
                - |
                  #!/bin/bash
                  set -e
                  set -o pipefail

                  echo ""
                  echo "=========================================="
                  echo "Scenario 8: bazel http_archive (pattern: msdebug, memfabric_hybrid)"
                  echo "=========================================="

                  echo "--- Create WORKSPACE with http_archive (googletest) ---"
                  cd "$WORKSPACE"
                  echo "--- wait for postStart to write .bazelrc with JVM trust args ---"
                  for i in $(seq 1 30); do
                    grep -q 'trustStorePassword' .bazelrc 2>/dev/null && break
                    sleep 1
                  done

                  cat >> "$WORKSPACE/.bazelrc" << 'EOF'
                  common --noenable_bzlmod
                  common --registry=https://gh-proxy.test.osinfra.cn/https://raw.githubusercontent.com/bazelbuild/bazel-central-registry/main/
                  build --cxxopt=-std=c++17
                  EOF

                  cat > WORKSPACE << 'EOF'
                  load("@bazel_tools//tools/build_defs/repo:http.bzl", "http_archive")
                  http_archive(
                      name = "googletest",
                      urls = ["https://gh-proxy.test.osinfra.cn/https://github.com/google/googletest/archive/refs/tags/v1.17.0.tar.gz"],
                      strip_prefix = "googletest-1.17.0",
                  )
                  # Bazel's own toolchain resolution implicitly fetches bazel_skylib
                  # from a hardcoded github.com URL (not covered by --registry, since
                  # this is WORKSPACE mode). Override it here to route through gh-proxy,
                  # since direct github.com connections from this cluster time out.
                  http_archive(
                      name = "bazel_skylib",
                      urls = ["https://gh-proxy.test.osinfra.cn/https://github.com/bazelbuild/bazel-skylib/releases/download/1.6.1/bazel-skylib-1.6.1.tar.gz"],
                  )
                  # Same reasoning: rules_cc's default fetch also hits github.com directly.
                  http_archive(
                      name = "rules_cc",
                      urls = ["https://gh-proxy.test.osinfra.cn/https://github.com/bazelbuild/rules_cc/releases/download/0.0.9/rules_cc-0.0.9.tar.gz"],
                      strip_prefix = "rules_cc-0.0.9",
                  )
                  # Same: rules_python is another DEFAULT.WORKSPACE.SUFFIX implicit dep
                  # fetched from hardcoded github.com (observed failing through squid).
                  # NOTE: must use bazel-contrib org — bazelbuild/rules_python 301-redirects
                  # to bazel-contrib and gh-proxy returns 502 on the redirect chain.
                  http_archive(
                      name = "rules_python",
                      urls = ["https://gh-proxy.test.osinfra.cn/https://github.com/bazel-contrib/rules_python/releases/download/0.24.0/rules_python-0.24.0.tar.gz"],
                      strip_prefix = "rules_python-0.24.0",
                  )
                  EOF
                  cat > BUILD.bazel << 'EOF'
                  cc_test(
                      name = "hello_test",
                      size = "small",
                      srcs = ["hello_test.cc"],
                      deps = ["@googletest//:gtest_main"],
                  )
                  EOF
                  cat > hello_test.cc << 'EOF'
                  #include <gtest/gtest.h>
                  TEST(Smoke, True) { EXPECT_EQ(1, 1); }
                  EOF

                  echo "--- bazel test (downloads bazel dist + http_archive via squid) ---"
                  T_START=$(date +%s%3N)
                  bazel test //:hello_test --test_output=errors --verbose_failures 2>&1 | tail -60
                  T_END=$(date +%s%3N)
                  echo "bazel test: $((T_END - T_START))ms"
                  echo "✅ bazel http_archive fetched + test passed"

                  echo ""
                  echo ""
                  echo "=========================================="
                  echo "DURATION: $((T_END - T_START))ms"
                  echo "✅ Scenario 8 completed."
                  echo "=========================================="
              lifecycle:
                postStart:
                  exec:
                    command:
                      - /bin/bash
                      - -c
                      - |
                        set +e

                        # JKS is stored base64-encoded in Vault (KV v2 stores
                        # strings only) → decode to a real keystore on disk.
                        # The secret mount is read-only, but /etc/squid-bazel-trust
                        # is a plain writable dir in the container layer.
                        S=/etc/squid-ca/squid-bazel-trust.jks
                        J=/etc/squid-bazel-trust/squid-bazel-trust.jks
                        mkdir -p /etc/squid-bazel-trust
                        if [ -f "$S" ]; then
                          if base64 -d "$S" > "$J" 2>/dev/null \
                             && [ -s "$J" ] \
                             && [ "$(od -An -tx1 -N4 "$J" | tr -d ' ')" = "feedfeed" ]; then
                            echo "JKS decoded from base64 -> $J"
                          else
                            cp "$S" "$J" 2>/dev/null
                            echo "JKS used as-is -> $J"
                          fi
                          chmod 644 "$J" 2>/dev/null
                        fi

                        # Bazel JVM trust: point JVM at the mounted squid-CA keystore
                        # (Bazel ignores JAVA_TOOL_OPTIONS; args must come via .bazelrc)
                        cat > "$WORKSPACE/.bazelrc" << 'EOF'
                        startup --host_jvm_args=-Djavax.net.ssl.trustStore=/etc/squid-bazel-trust/squid-bazel-trust.jks
                        startup --host_jvm_args=-Djavax.net.ssl.trustStorePassword=changeit
                        EOF

                        P=/etc/squid-ca/squid-ca.pem
                        if [ -f "$P" ]; then
                          if [ -d /etc/pki/ca-trust/source/anchors ]; then
                            cp "$P" /etc/pki/ca-trust/source/anchors/squid-ca.pem >/dev/null 2>&1
                            update-ca-trust extract >/dev/null 2>&1
                          else
                            cp "$P" /usr/local/share/ca-certificates/squid-ca.crt >/dev/null 2>&1
                            update-ca-certificates -f >/dev/null 2>&1
                          fi
                        fi

                        if command -v apt-get >/dev/null 2>&1 && [ -n "$HTTPS_PROXY" ]; then
                          mkdir -p /etc/apt/apt.conf.d
                          printf 'Acquire::http::Proxy "http://squid-cache.squid.svc.cluster.local:3128";\nAcquire::https::Proxy "http://squid-cache.squid.svc.cluster.local:3128";\n' > /etc/apt/apt.conf.d/99squid-proxy
                        fi

                        exit 0
              workingDir: /workspace
              resources:
                limits:
                  cpu: "2"
                  memory: 2Gi
                requests:
                  cpu: "2"
                  memory: 2Gi
              env:
                - name: WORKSPACE
                  value: /workspace
                - name: HTTP_PROXY
                  value: "http://squid-cache.squid.svc.cluster.local:3128"
                - name: HTTPS_PROXY
                  value: "http://squid-cache.squid.svc.cluster.local:3128"
                - name: http_proxy
                  value: "http://squid-cache.squid.svc.cluster.local:3128"
                - name: https_proxy
                  value: "http://squid-cache.squid.svc.cluster.local:3128"
                - name: NO_PROXY
                  value: "localhost,127.0.0.1,.buildkitd,.svc.cluster.local,.cluster.local"
                - name: no_proxy
                  value: "localhost,127.0.0.1,.buildkitd,.svc.cluster.local,.cluster.local"
                - name: SSL_CERT_FILE
                  value: /etc/squid-ca/squid-ca.pem
                - name: CURL_CA_BUNDLE
                  value: /etc/squid-ca/squid-ca.pem
                - name: REQUESTS_CA_BUNDLE
                  value: /etc/squid-ca/squid-ca.pem
                - name: GIT_SSL_CAINFO
                  value: /etc/squid-ca/squid-ca.pem
                - name: PIP_CERT
                  value: /etc/squid-ca/squid-ca.pem
                - name: NODE_EXTRA_CA_CERTS
                  value: /etc/squid-ca/squid-ca.pem
              volumeMounts:
                - name: squid-ca
                  mountPath: /etc/squid-ca
                  readOnly: true
          volumes:
            - name: squid-ca
              secret:
                secretName: squid-ca-cert
                items:
                  - key: squid-ca.pem
                    path: squid-ca.pem
                  - key: squid-bazel-trust.jks
                    path: squid-bazel-trust.jks
                optional: true
          nodeSelector:
            kubernetes.io/arch: arm64
          imagePullSecrets:
            - name: huawei-swr-image-pull-secret-model-gy
          activeDeadlineSeconds: 2400
          securityContext:
            runAsUser: 0
          restartPolicy: Never
