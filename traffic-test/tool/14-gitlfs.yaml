apiVersion: batch.volcano.sh/v1alpha1
kind: Job
metadata:
  generateName: test-squid-gitlfs-
  namespace: squid
  labels:
    kubernetes.io/arch: arm64
    pipeline/run-id: test-squid-gitlfs
spec:
  policies:
    - event: PodFailed
      action: AbortJob
  queue: shared-flexible-queue
  maxRetry: 1
  minAvailable: 1
  ttlSecondsAfterFinished: 1800
  tasks:
    - name: test-squid-gitlfs
      replicas: 1
      maxRetry: 1
      template:
        spec:
          containers:
            - name: test
              image: swr.cn-southwest-2.myhuaweicloud.com/modelfoundry/ubuntu:24.04
              command:
                - bash
                - -c
              args:
                - |
                  #!/bin/bash
                  set -e
                  sed -i 's|http://ports.ubuntu.com/ubuntu-ports|http://mirrors.huaweicloud.com/ubuntu-ports|g' \
                    /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2>/dev/null || true
                  apt-get update -qq 2>&1 | tail -2 || true
                  apt-get install -y -qq git curl 2>&1 | tail -3 || { apt-get update -qq 2>&1 | tail -2 || true; apt-get install -y -qq git curl 2>&1 | tail -3; }
                  T_START=$(date +%s%3N)
                  echo ""
                  echo "=========================================="
                  echo "Scenario 14: git-lfs (model files in LFS — ascend-docker-image,"
                  echo "              DrivingSDK GR00T, mind-cluster docs)"
                  echo "=========================================="

                  echo "--- Install git-lfs (github release binary via squid) ---"
                  curl -sL -o /tmp/git-lfs.tar.gz \
                    https://gh-proxy.test.osinfra.cn/https://github.com/git-lfs/git-lfs/releases/download/v3.6.1/git-lfs-linux-arm64-v3.6.1.tar.gz
                  tar -C /usr/local -xzf /tmp/git-lfs.tar.gz 2>&1 | tail -1
                  export PATH=/usr/local/git-lfs-3.6.1:$PATH
                  git lfs version
                  git lfs install --skip-repo 2>&1 | tail -1

                  echo ""
                  echo "--- clone GitHub LFS test repo (git-lfs/git-lfs) via gh-proxy ---"
                  # git-lfs/git-lfs has test fixtures stored as LFS objects
                  rm -rf /workspace/lfstest && mkdir -p /workspace/lfstest && cd /workspace/lfstest
                  T0=$(date +%s%3N)
                  GIT_LFS_SKIP_SMUDGE=0 git clone --depth=1 https://gh-proxy.test.osinfra.cn/https://github.com/git-lfs/git-lfs repo 2>&1 | tail -3
                  T1=$(date +%s%3N)
                  echo "clone: $((T1 - T0))ms"
                  echo "LFS files:"
                  git -C repo lfs ls-files 2>&1 | head -5
                  du -sh repo

                  echo ""
                  echo ""
                  echo "--- git lfs pull round-trip (fetch-only mode) ---"
                  cd repo
                  T0=$(date +%s%3N)
                  git lfs pull 2>&1 | tail -2
                  T1=$(date +%s%3N)
                  echo "git lfs pull: $((T1 - T0))ms"
                  echo "✅ git-lfs objects downloaded through squid"

                  echo ""
                  echo "=========================================="
                  T_END=$(date +%s%3N)
                  echo "DURATION: $((T_END - T_START))ms"
                  echo "✅ Scenario 14 completed."
                  echo "=========================================="
              lifecycle:
                postStart:
                  exec:
                    command:
                      - /bin/bash
                      - -c
                      - |
                        set +e

                        # Bazel JVM trust: point JVM at the mounted squid-CA keystore
                        # (Bazel ignores JAVA_TOOL_OPTIONS; args must come via .bazelrc)
                        cat > "$WORKSPACE/.bazelrc" << 'EOF'
                        common --noenable_bzlmod
                        common --registry=https://gh-proxy.test.osinfra.cn/https://raw.githubusercontent.com/bazelbuild/bazel-central-registry/main/
                        build --cxxopt=-std=c++17
                        startup --host_jvm_args=-Djavax.net.ssl.trustStore=/etc/squid-bazel-trust/squid-bazel-trust.jks
                        startup --host_jvm_args=-Djavax.net.ssl.trustStorePassword=changeit
                        EOF

                        P=/etc/squid-ca/squid-ca.pem
                        if [ -f "$P" ]; then
                          if [ -d /etc/pki/ca-trust/source/anchors ]; then
                            cp "$P" /etc/pki/ca-trust/source/anchors/squid-ca.pem >/dev/null 2>&1
                            update-ca-trust extract >/dev/null 2>&1
                          else
                            cp "$P" /usr/local/share/ca-certificates/squid-ca.crt >/dev/null 2>&1
                            update-ca-certificates -f >/dev/null 2>&1
                          fi
                        fi

                        if command -v apt-get >/dev/null 2>&1 && [ -n "$HTTPS_PROXY" ]; then
                          mkdir -p /etc/apt/apt.conf.d
                          printf 'Acquire::http::Proxy "http://squid-cache.squid.svc.cluster.local:3128";\nAcquire::https::Proxy "http://squid-cache.squid.svc.cluster.local:3128";\n' > /etc/apt/apt.conf.d/99squid-proxy
                        fi

                        exit 0
              workingDir: /workspace
              resources:
                limits:
                  cpu: "2"
                  memory: 2Gi
                requests:
                  cpu: "2"
                  memory: 2Gi
              env:
                - name: WORKSPACE
                  value: /workspace
                - name: HTTP_PROXY
                  value: "http://squid-cache.squid.svc.cluster.local:3128"
                - name: HTTPS_PROXY
                  value: "http://squid-cache.squid.svc.cluster.local:3128"
                - name: http_proxy
                  value: "http://squid-cache.squid.svc.cluster.local:3128"
                - name: https_proxy
                  value: "http://squid-cache.squid.svc.cluster.local:3128"
                - name: NO_PROXY
                  value: "localhost,127.0.0.1,.buildkitd,.svc.cluster.local,.cluster.local"
                - name: no_proxy
                  value: "localhost,127.0.0.1,.buildkitd,.svc.cluster.local,.cluster.local"
                - name: SSL_CERT_FILE
                  value: /etc/squid-ca/squid-ca.pem
                - name: CURL_CA_BUNDLE
                  value: /etc/squid-ca/squid-ca.pem
                - name: REQUESTS_CA_BUNDLE
                  value: /etc/squid-ca/squid-ca.pem
                - name: GIT_SSL_CAINFO
                  value: /etc/squid-ca/squid-ca.pem
                - name: PIP_CERT
                  value: /etc/squid-ca/squid-ca.pem
                - name: NODE_EXTRA_CA_CERTS
                  value: /etc/squid-ca/squid-ca.pem
              volumeMounts:
                - name: squid-ca
                  mountPath: /etc/squid-ca
                  readOnly: true
          volumes:
            - name: squid-ca
              secret:
                secretName: squid-ca-cert
                items:
                  - key: squid-ca.pem
                    path: squid-ca.pem
                optional: true
          nodeSelector:
            kubernetes.io/arch: arm64
          imagePullSecrets:
            - name: huawei-swr-image-pull-secret-model-gy
          activeDeadlineSeconds: 2400
          securityContext:
            runAsUser: 0
          restartPolicy: Never
