apiVersion: batch.volcano.sh/v1alpha1
kind: Job
metadata:
  generateName: test-squid-cachedemo-
  namespace: squid
  labels:
    kubernetes.io/arch: arm64
    pipeline/run-id: test-squid-cachedemo
spec:
  policies:
    - event: PodFailed
      action: AbortJob
  queue: shared-flexible-queue
  maxRetry: 1
  minAvailable: 1
  ttlSecondsAfterFinished: 1800
  tasks:
    - name: test-squid-cachedemo
      replicas: 1
      maxRetry: 1
      template:
        spec:
          containers:
            - name: test
              image: swr.cn-southwest-2.myhuaweicloud.com/modelfoundry/ubuntu:24.04
              command:
                - bash
                - -c
              args:
                - |
                  #!/bin/bash
                  set -e
                  sed -i 's|http://ports.ubuntu.com/ubuntu-ports|http://mirrors.huaweicloud.com/ubuntu-ports|g' \
                    /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2>/dev/null || true
                  apt-get update -qq 2>&1 | tail -2 || true
                  apt-get install -y -qq python3 python3-pip curl wget 2>&1 | tail -3 || { apt-get update -qq 2>&1 | tail -2 || true; apt-get install -y -qq python3 python3-pip curl wget 2>&1 | tail -3; }

                  echo ""
                  echo "=========================================="
                  echo "Squid Cache Demo: same 12 packages, fetched TWICE"
                  echo "  Round 1 = cold cache (MISS, populates cache)"
                  echo "  Round 2 = warm cache (HIT, served from squid disk)"
                  echo "  Same pod, same network path — only cache state differs"
                  echo "=========================================="

                  # A larger basket biased toward BIG wheels (numpy/pandas/scipy
                  # class packages, tens of MB each) so the cache win is obvious —
                  # small wheels are already fast enough that caching barely shows.
                  # All traffic here goes through squid (HTTP_PROXY is set).
                  PACKAGES="numpy pandas scipy matplotlib pillow \
                            pyarrow grpcio protobuf opencv-python-headless \
                            scikit-learn"

                  fetch_round () {
                    local round="$1"
                    rm -rf /tmp/wheels-$round; mkdir -p /tmp/wheels-$round
                    T0=$(date +%s%3N)
                    pip download --no-deps --no-cache-dir \
                      --index-url https://mirrors.huaweicloud.com/repository/pypi/simple \
                      -d /tmp/wheels-$round $PACKAGES > /tmp/pipdl-$round.log 2>&1 || true
                    T1=$(date +%s%3N)
                    local ms=$((T1 - T0))
                    local bytes=$(du -sb /tmp/wheels-$round 2>/dev/null | awk '{print $1}')
                    local count=$(ls /tmp/wheels-$round 2>/dev/null | wc -l)
                    echo "ROUND_${round}: ${count} files, ${bytes:-0} bytes, ${ms}ms"
                    if [ "${bytes:-0}" -gt 0 ] && [ "$ms" -gt 0 ]; then
                      echo "ROUND_${round}_SPEED: $(( bytes * 1000 / ms )) B/s"
                    fi
                  }

                  echo ""
                  echo "--- Round 1 (COLD — cache MISS expected) ---"
                  fetch_round 1

                  echo ""
                  echo "--- Round 2 (WARM — cache HIT expected) ---"
                  fetch_round 2

                  echo ""
                  echo "--- File sizes fetched ---"
                  ls -lhS /tmp/wheels-1 | head -6 | awk '{print $5, $9}'

                  echo ""
                  echo "=========================================="
                  echo "✅ Cache demo completed."
                  echo "=========================================="
              lifecycle:
                postStart:
                  exec:
                    command:
                      - /bin/bash
                      - -c
                      - |
                        set +e
                        P=/etc/squid-ca/squid-ca.pem
                        if [ -f "$P" ]; then
                          if [ -d /etc/pki/ca-trust/source/anchors ]; then
                            cp "$P" /etc/pki/ca-trust/source/anchors/squid-ca.pem >/dev/null 2>&1
                            update-ca-trust extract >/dev/null 2>&1
                          else
                            cp "$P" /usr/local/share/ca-certificates/squid-ca.crt >/dev/null 2>&1
                            update-ca-certificates -f >/dev/null 2>&1
                          fi
                        fi
                        if command -v apt-get >/dev/null 2>&1; then
                          mkdir -p /etc/apt/apt.conf.d
                          printf 'Acquire::http::Proxy "http://squid-cache.squid.svc.cluster.local:3128";\nAcquire::https::Proxy "http://squid-cache.squid.svc.cluster.local:3128";\n' > /etc/apt/apt.conf.d/99squid-proxy
                        fi
                        exit 0
              workingDir: /workspace
              resources:
                limits:
                  cpu: "2"
                  memory: 2Gi
                requests:
                  cpu: "2"
                  memory: 2Gi
              env:
                - name: HTTP_PROXY
                  value: "http://squid-cache.squid.svc.cluster.local:3128"
                - name: HTTPS_PROXY
                  value: "http://squid-cache.squid.svc.cluster.local:3128"
                - name: http_proxy
                  value: "http://squid-cache.squid.svc.cluster.local:3128"
                - name: https_proxy
                  value: "http://squid-cache.squid.svc.cluster.local:3128"
                - name: NO_PROXY
                  value: "localhost,127.0.0.1,hf-mirror.com,.buildkitd,.svc.cluster.local,.cluster.local"
                - name: no_proxy
                  value: "localhost,127.0.0.1,hf-mirror.com,.buildkitd,.svc.cluster.local,.cluster.local"
                - name: SSL_CERT_FILE
                  value: /etc/squid-ca/squid-ca.pem
                - name: CURL_CA_BUNDLE
                  value: /etc/squid-ca/squid-ca.pem
                - name: REQUESTS_CA_BUNDLE
                  value: /etc/squid-ca/squid-ca.pem
                - name: GIT_SSL_CAINFO
                  value: /etc/squid-ca/squid-ca.pem
                - name: PIP_CERT
                  value: /etc/squid-ca/squid-ca.pem
                - name: NODE_EXTRA_CA_CERTS
                  value: /etc/squid-ca/squid-ca.pem
              volumeMounts:
                - name: squid-ca
                  mountPath: /etc/squid-ca
                  readOnly: true
          volumes:
            - name: squid-ca
              secret:
                secretName: squid-ca-cert
                items:
                  - key: squid-ca.pem
                    path: squid-ca.pem
                optional: true
          nodeSelector:
            kubernetes.io/arch: arm64
          imagePullSecrets:
            - name: huawei-swr-image-pull-secret-model-gy
          activeDeadlineSeconds: 1200
          securityContext:
            runAsUser: 0
          restartPolicy: Never
