apiVersion: batch.volcano.sh/v1alpha1
kind: Job
metadata:
  generateName: test-squid-hf-
  namespace: squid
  labels:
    kubernetes.io/arch: arm64
    pipeline/run-id: test-squid-hf
spec:
  policies:
    - event: PodFailed
      action: AbortJob
  queue: shared-flexible-queue
  maxRetry: 1
  minAvailable: 1
  ttlSecondsAfterFinished: 1800
  tasks:
    - name: test-squid-hf
      replicas: 1
      maxRetry: 1
      template:
        spec:
          containers:
            - name: test
              image: swr.cn-southwest-2.myhuaweicloud.com/modelfoundry/ubuntu:24.04
              command:
                - bash
                - -c
              args:
                - |
                  #!/bin/bash
                  set -e
                  sed -i 's|http://ports.ubuntu.com/ubuntu-ports|http://mirrors.huaweicloud.com/ubuntu-ports|g' \
                    /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2>/dev/null || true
                  apt-get update -qq 2>&1 | tail -2 || true
                  apt-get install -y -qq python3 python3-pip 2>&1 | tail -3 || { apt-get update -qq 2>&1 | tail -2 || true; apt-get install -y -qq python3 python3-pip 2>&1 | tail -3; }
                  T_START=$(date +%s%3N)
                  export HF_ENDPOINT=https://hf-mirror.com
                  echo ""
                  echo "=========================================="
                  echo "Scenario 13: huggingface_hub (snapshot_download / hf download —"
                  echo "              328 files across pytorch, MindSpeed-MM, DrivingSDK...)"
                  echo "=========================================="

                  echo "--- Install huggingface_hub (pip wheel via squid) ---"
                  pip install -q --break-system-packages -i https://mirrors.huaweicloud.com/repository/pypi/simple huggingface_hub 2>&1 | tail -1
                  hf --version

                  # tiny-gpt2: config ~2MB + LFS-weights pytorch_model.bin (2.5MB) —
                  # the model-download pattern from pytorch/benchmarks/llm/download_hf.py
                  MODEL="sshleifer/tiny-gpt2"

                  echo ""
                  echo "--- hf download (cold, via cdn-lfs.huggingface.co) ---"
                  T0=$(date +%s%3N)
                  hf download "$MODEL" --local-dir /tmp/hf 2>&1 | tail -4
                  T1=$(date +%s%3N)
                  echo "fetch: $((T1 - T0))ms, $(du -sh /tmp/hf | cut -f1)"

                  echo ""
                  echo ""
                  echo "--- python API check (snapshot_download — the actual org pattern) ---"
                  python3 - << 'EOF'
                  from huggingface_hub import snapshot_download
                  p = snapshot_download("sshleifer/tiny-gpt2", local_dir="/tmp/hf-snap")
                  import os
                  print("✅ snapshot_download OK:", p, "| files:", len(os.listdir(p)))
                  EOF

                  echo ""
                  echo "=========================================="
                  T_END=$(date +%s%3N)
                  echo "DURATION: $((T_END - T_START))ms"
                  echo "✅ Scenario 13 completed."
                  echo "=========================================="
              lifecycle:
                postStart:
                  exec:
                    command:
                      - /bin/bash
                      - -c
                      - |
                        set +e

                        # Bazel JVM trust: point JVM at the mounted squid-CA keystore
                        # (Bazel ignores JAVA_TOOL_OPTIONS; args must come via .bazelrc)
                        cat > "$WORKSPACE/.bazelrc" << 'EOF'
                        common --noenable_bzlmod
                        common --registry=https://gh-proxy.test.osinfra.cn/https://raw.githubusercontent.com/bazelbuild/bazel-central-registry/main/
                        build --cxxopt=-std=c++17
                        startup --host_jvm_args=-Djavax.net.ssl.trustStore=/etc/squid-bazel-trust/squid-bazel-trust.jks
                        startup --host_jvm_args=-Djavax.net.ssl.trustStorePassword=changeit
                        EOF

                        P=/etc/squid-ca/squid-ca.pem
                        if [ -f "$P" ]; then
                          if [ -d /etc/pki/ca-trust/source/anchors ]; then
                            cp "$P" /etc/pki/ca-trust/source/anchors/squid-ca.pem >/dev/null 2>&1
                            update-ca-trust extract >/dev/null 2>&1
                          else
                            cp "$P" /usr/local/share/ca-certificates/squid-ca.crt >/dev/null 2>&1
                            update-ca-certificates -f >/dev/null 2>&1
                          fi
                        fi

                        if command -v apt-get >/dev/null 2>&1 && [ -n "$HTTPS_PROXY" ]; then
                          mkdir -p /etc/apt/apt.conf.d
                          printf 'Acquire::http::Proxy "http://squid-cache.squid.svc.cluster.local:3128";\nAcquire::https::Proxy "http://squid-cache.squid.svc.cluster.local:3128";\n' > /etc/apt/apt.conf.d/99squid-proxy
                        fi

                        exit 0
              workingDir: /workspace
              resources:
                limits:
                  cpu: "2"
                  memory: 2Gi
                requests:
                  cpu: "2"
                  memory: 2Gi
              env:
                - name: WORKSPACE
                  value: /workspace
                - name: HTTP_PROXY
                  value: "http://squid-cache.squid.svc.cluster.local:3128"
                - name: HTTPS_PROXY
                  value: "http://squid-cache.squid.svc.cluster.local:3128"
                - name: http_proxy
                  value: "http://squid-cache.squid.svc.cluster.local:3128"
                - name: https_proxy
                  value: "http://squid-cache.squid.svc.cluster.local:3128"
                - name: NO_PROXY
                  value: "localhost,127.0.0.1,.buildkitd,.svc.cluster.local,.cluster.local"
                - name: no_proxy
                  value: "localhost,127.0.0.1,.buildkitd,.svc.cluster.local,.cluster.local"
                - name: SSL_CERT_FILE
                  value: /etc/squid-ca/squid-ca.pem
                - name: CURL_CA_BUNDLE
                  value: /etc/squid-ca/squid-ca.pem
                - name: REQUESTS_CA_BUNDLE
                  value: /etc/squid-ca/squid-ca.pem
                - name: GIT_SSL_CAINFO
                  value: /etc/squid-ca/squid-ca.pem
                - name: PIP_CERT
                  value: /etc/squid-ca/squid-ca.pem
                - name: NODE_EXTRA_CA_CERTS
                  value: /etc/squid-ca/squid-ca.pem
                - name: HF_HUB_ENABLE_HF_TRANSFER
                  value: "0"
              volumeMounts:
                - name: squid-ca
                  mountPath: /etc/squid-ca
                  readOnly: true
          volumes:
            - name: squid-ca
              secret:
                secretName: squid-ca-cert
                items:
                  - key: squid-ca.pem
                    path: squid-ca.pem
                optional: true
          nodeSelector:
            kubernetes.io/arch: arm64
          imagePullSecrets:
            - name: huawei-swr-image-pull-secret-model-gy
          activeDeadlineSeconds: 2400
          securityContext:
            runAsUser: 0
          restartPolicy: Never
