          - |
            git config --global url."http://git-cache-http-server.git-cache.svc.cluster.local:8080".insteadOf "https://gitcode.com" || echo "WARNING: git config failed for gitcode"
            git config --global url."http://git-cache-github.git-cache.svc.cluster.local:8080".insteadOf "https://gh-proxy.test.osinfra.cn/https://github.com" || echo "WARNING: git config failed for github"
            git config --global url."http://git-cache-github.git-cache.svc.cluster.local:8080".insteadOf "https://github.com" || echo "WARNING: git config failed for github"
            git config --global url."http://git-cache-gitee.git-cache.svc.cluster.local:8080".insteadOf "https://gitee.com" || echo "WARNING: git config failed for gitee"
            git config --global url."http://git-cache-atomgit.git-cache.svc.cluster.local:8080".insteadOf "https://atomgit.com" || echo "WARNING: git config failed for atomgit"
            git config --global url."http://git-cache-codehub.git-cache.svc.cluster.local:8080".insteadOf "https://codehub.devcloud.cn-north-4.huaweicloud.com" || echo "WARNING: git config failed for codehub"

            trap 'EXIT_CODE=$?; [ "$EXIT_CODE" -ne 0 ] && sleep 10' EXIT
            {
                set +e
                echo "===== System Info ====="
                echo "===== OS ====="
                uname -a
                human_bytes() {
                    local bytes=$1
                    case "$bytes" in
                        max|-1) echo "unlimited"; return ;;
                    esac
                    if [ "${bytes#-}" != "$bytes" ]; then
                        echo "unlimited"
                        return
                    fi
                    if [ "$bytes" -ge 1073741824 ]; then
                        echo "$((bytes / 1073741824))GiB"
                    elif [ "$bytes" -ge 1048576 ]; then
                        echo "$((bytes / 1048576))MiB"
                    elif [ "$bytes" -ge 1024 ]; then
                        echo "$((bytes / 1024))KiB"
                    else
                        echo "${bytes}B"
                    fi
                }
                echo "===== CPU ====="
                req_cores=""
                if [ -r /sys/fs/cgroup/cpu.weight ]; then
                    weight=$(cat /sys/fs/cgroup/cpu.weight)
                    if [ -n "$weight" ] && [ "$weight" -gt 1 ] 2>/dev/null; then
                        req_cores=$(( ( ( (weight - 1) * 262142 / 9999 + 2 ) * 1000 / 1024 + 500 ) / 1000 ))
                    fi
                elif [ -r /sys/fs/cgroup/cpu/cpu.shares ]; then
                    shares=$(cat /sys/fs/cgroup/cpu/cpu.shares)
                    if [ -n "$shares" ] && [ "$shares" -gt 2 ] 2>/dev/null; then
                        req_cores=$(( ( shares * 1000 / 1024 + 500 ) / 1000 ))
                    fi
                fi
                if [ -n "$req_cores" ]; then
                    echo "CPU request: ${req_cores} cores"
                fi
                if [ -r /sys/fs/cgroup/cpu.max ]; then
                    read -r quota period < /sys/fs/cgroup/cpu.max
                    if [ "$quota" != "max" ] && [ -n "$period" ] && [ "$period" != "0" ]; then
                        echo "CPU limit: $((quota / period)) cores"
                    fi
                elif [ -r /sys/fs/cgroup/cpu/cpu.cfs_quota_us ] && [ -r /sys/fs/cgroup/cpu/cpu.cfs_period_us ]; then
                    quota=$(cat /sys/fs/cgroup/cpu/cpu.cfs_quota_us)
                    period=$(cat /sys/fs/cgroup/cpu/cpu.cfs_period_us)
                    if [ "$quota" != "-1" ] && [ -n "$period" ] && [ "$period" != "0" ]; then
                        echo "CPU limit: $((quota / period)) cores"
                    fi
                fi
                if [ -r /sys/fs/cgroup/cpu.stat ]; then
                    t1=$(grep '^usage_usec ' /sys/fs/cgroup/cpu.stat | cut -d ' ' -f2)
                    sleep 1
                    t2=$(grep '^usage_usec ' /sys/fs/cgroup/cpu.stat | cut -d ' ' -f2)
                    if [ -n "$t1" ] && [ -n "$t2" ] && [ "$t2" -ge "$t1" ] 2>/dev/null; then
                        echo "CPU usage: $(awk -v d="$((t2 - t1))" 'BEGIN { printf "%.2f cores", d / 1000000 }')"
                    fi
                elif [ -r /sys/fs/cgroup/cpuacct/cpuacct.usage ]; then
                    n1=$(cat /sys/fs/cgroup/cpuacct/cpuacct.usage)
                    sleep 1
                    n2=$(cat /sys/fs/cgroup/cpuacct/cpuacct.usage)
                    if [ -n "$n1" ] && [ -n "$n2" ] && [ "$n2" -ge "$n1" ] 2>/dev/null; then
                        echo "CPU usage: $(awk -v d="$((n2 - n1))" 'BEGIN { printf "%.2f cores", d / 1000000000 }')"
                    fi
                fi
                echo "===== Memory ====="
                if [ -r /sys/fs/cgroup/memory.max ]; then
                    echo "Memory limit: $(human_bytes "$(cat /sys/fs/cgroup/memory.max)")"
                    if [ -r /sys/fs/cgroup/memory.current ]; then
                        echo "Memory usage: $(human_bytes "$(cat /sys/fs/cgroup/memory.current)")"
                    fi
                elif [ -r /sys/fs/cgroup/memory/memory.limit_in_bytes ]; then
                    echo "Memory limit: $(human_bytes "$(cat /sys/fs/cgroup/memory/memory.limit_in_bytes)")"
                    if [ -r /sys/fs/cgroup/memory/memory.usage_in_bytes ]; then
                        echo "Memory usage: $(human_bytes "$(cat /sys/fs/cgroup/memory/memory.usage_in_bytes)")"
                    fi
                else
                    free -h
                fi
                echo "===== NPU ====="
                if command -v npu-smi >/dev/null 2>&1; then
                    npu-smi info
                else
                    echo "npu-smi not available"
                fi
            } 2>/dev/null || true
            if [ -n "https://gitcode.com/Ascend/MindSpeed-MM.git" ]; then
                CLONE_OK=true
                git clone --single-branch -b "master" "https://gitcode.com/Ascend/MindSpeed-MM.git" "$WORKSPACE" || {
                    mkdir "$WORKSPACE" || echo "WARNING: directory exists"
                    echo "WARNING: 主项目拉取失败！"
                    CLONE_OK=false
                }
                cd "$WORKSPACE"
                if [ "$CLONE_OK" = "true" ]; then
                    git fetch origin +refs/merge-requests/3030/head:pr
                    git config --global user.name "robot"
                    git config --global user.email "your@emaple.com"
                    git merge pr --no-ff -m "Merge master from refs/merge-requests/3030/head" || {
                        echo "WARNING: 主项目merge失败！"
                    }
                fi
            fi
            cat > .bazelrc << 'EOF'
            # Use GitHub BCR source as the registry
            common --registry=https://gh-proxy.test.osinfra.cn/https://raw.githubusercontent.com/bazelbuild/bazel-central-registry/main/
            EOF
            #!/bin/bash
            set +x  # 强制关闭命令回显（核心修复）

            # 所有输出只会打印内容，不会显示命令本身
            echo "start mindspeed-mm st"

            echo "------------------------------------1. git clone code-----------------------------------"
            rm -rf CODE
            git clone https://gitcode.com/Ascend/MindSpeed-MM.git -b master CODE
            cd CODE

            git config user.email AtlasAccount@noreply.gitcode.com
            git config user.name AtlasAccount

            git fetch origin refs/merge-requests/3030/head:new_3030
            git checkout new_3030
            git merge origin/master

            echo "------------------------------------2. run st script-----------------------------------"
            bash ci/mm_ci_trigger.sh /workspace 3030 master ut
