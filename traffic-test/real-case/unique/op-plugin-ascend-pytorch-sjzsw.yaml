            user.email \"your@emaple.com\"\n        git merge pr --no-ff -m \"Merge
            v2.7.1-26.1.0 from refs/merge-requests/45232/head\" || {\n            echo
            \"WARNING: 主项目merge失败！\"\n        }\n    fi\nfi\ncat > .bazelrc << 'EOF'\n#
            Use GitHub BCR source as the registry\ncommon --registry=https://gh-proxy.test.osinfra.cn/https://raw.githubusercontent.com/bazelbuild/bazel-central-registry/main/\nEOF\nset
