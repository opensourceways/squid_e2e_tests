            cie\n# 执行UT\nbash cie/common/common/merge.sh v2.7.1-26.1.0 https://gitcode.com/Ascend/pytorch.git
            45232 /workspace\ncd ./CODE\ngit diff-tree -r --name-only --no-commit-id
            origin/v2.7.1-26.1.0 HEAD > ../modify_files.txt\ncat ../modify_files.txt
            \ncd -\nbash cie/common/UT/pytorch_ut_inductor.sh v2.7.1-26.1.0 3.10 45232
            /workspace 2 4 \n\ncd /tmp\nrm -rf *\n\ncd ${WORKSPACE}\ncp -r --parents
            CODE/time_data.json /output/\n); _ec=$?; echo $_ec > /output/.ascend-done;
            exit $_ec"
