            git config failed for codehub\"\n\ntrap 'EXIT_CODE=$?; [ \"$EXIT_CODE\"
            -ne 0 ] && sleep 10' EXIT\n{\n    set +e\n    echo \"===== System Info
            =====\"\n    echo \"===== OS =====\"\n    uname -a\n    human_bytes()
            {\n        local bytes=$1\n        case \"$bytes\" in\n            max|-1)
            echo \"unlimited\"; return ;;\n        esac\n        if [ \"${bytes#-}\"
            != \"$bytes\" ]; then\n            echo \"unlimited\"\n            return\n
            \       fi\n        if [ \"$bytes\" -ge 1073741824 ]; then\n            echo
            \"$((bytes / 1073741824))GiB\"\n        elif [ \"$bytes\" -ge 1048576
            ]; then\n            echo \"$((bytes / 1048576))MiB\"\n        elif [
            \"$bytes\" -ge 1024 ]; then\n            echo \"$((bytes / 1024))KiB\"\n
            \       else\n            echo \"${bytes}B\"\n        fi\n    }\n    echo
            \"===== CPU =====\"\n    req_cores=\"\"\n    if [ -r /sys/fs/cgroup/cpu.weight
            ]; then\n        weight=$(cat /sys/fs/cgroup/cpu.weight)\n        if [
            -n \"$weight\" ] && [ \"$weight\" -gt 1 ] 2>/dev/null; then\n            req_cores=$((
            ( ( (weight - 1) * 262142 / 9999 + 2 ) * 1000 / 1024 + 500 ) / 1000 ))\n
            \       fi\n    elif [ -r /sys/fs/cgroup/cpu/cpu.shares ]; then\n        shares=$(cat
            /sys/fs/cgroup/cpu/cpu.shares)\n        if [ -n \"$shares\" ] && [ \"$shares\"
            -gt 2 ] 2>/dev/null; then\n            req_cores=$(( ( shares * 1000 /
            1024 + 500 ) / 1000 ))\n        fi\n    fi\n    if [ -n \"$req_cores\"
            ]; then\n        echo \"CPU request: ${req_cores} cores\"\n    fi\n    if
            [ -r /sys/fs/cgroup/cpu.max ]; then\n        read -r quota period < /sys/fs/cgroup/cpu.max\n
            \       if [ \"$quota\" != \"max\" ] && [ -n \"$period\" ] && [ \"$period\"
            != \"0\" ]; then\n            echo \"CPU limit: $((quota / period)) cores\"\n
            \       fi\n    elif [ -r /sys/fs/cgroup/cpu/cpu.cfs_quota_us ] && [ -r
            /sys/fs/cgroup/cpu/cpu.cfs_period_us ]; then\n        quota=$(cat /sys/fs/cgroup/cpu/cpu.cfs_quota_us)\n
            \       period=$(cat /sys/fs/cgroup/cpu/cpu.cfs_period_us)\n        if
            [ \"$quota\" != \"-1\" ] && [ -n \"$period\" ] && [ \"$period\" != \"0\"
            ]; then\n            echo \"CPU limit: $((quota / period)) cores\"\n        fi\n
            \   fi\n    if [ -r /sys/fs/cgroup/cpu.stat ]; then\n        t1=$(grep
            '^usage_usec ' /sys/fs/cgroup/cpu.stat | cut -d ' ' -f2)\n        sleep
            1\n        t2=$(grep '^usage_usec ' /sys/fs/cgroup/cpu.stat | cut -d '
            ' -f2)\n        if [ -n \"$t1\" ] && [ -n \"$t2\" ] && [ \"$t2\" -ge \"$t1\"
            ] 2>/dev/null; then\n            echo \"CPU usage: $(awk -v d=\"$((t2
            - t1))\" 'BEGIN { printf \"%.2f cores\", d / 1000000 }')\"\n        fi\n
            \   elif [ -r /sys/fs/cgroup/cpuacct/cpuacct.usage ]; then\n        n1=$(cat
            /sys/fs/cgroup/cpuacct/cpuacct.usage)\n        sleep 1\n        n2=$(cat
            /sys/fs/cgroup/cpuacct/cpuacct.usage)\n        if [ -n \"$n1\" ] && [
            -n \"$n2\" ] && [ \"$n2\" -ge \"$n1\" ] 2>/dev/null; then\n            echo
            \"CPU usage: $(awk -v d=\"$((n2 - n1))\" 'BEGIN { printf \"%.2f cores\",
            d / 1000000000 }')\"\n        fi\n    fi\n    echo \"===== Memory =====\"\n
            \   if [ -r /sys/fs/cgroup/memory.max ]; then\n        echo \"Memory limit:
            $(human_bytes \"$(cat /sys/fs/cgroup/memory.max)\")\"\n        if [ -r
            /sys/fs/cgroup/memory.current ]; then\n            echo \"Memory usage:
            $(human_bytes \"$(cat /sys/fs/cgroup/memory.current)\")\"\n        fi\n
            \   elif [ -r /sys/fs/cgroup/memory/memory.limit_in_bytes ]; then\n        echo
            \"Memory limit: $(human_bytes \"$(cat /sys/fs/cgroup/memory/memory.limit_in_bytes)\")\"\n
            \       if [ -r /sys/fs/cgroup/memory/memory.usage_in_bytes ]; then\n
            \           echo \"Memory usage: $(human_bytes \"$(cat /sys/fs/cgroup/memory/memory.usage_in_bytes)\")\"\n
            \       fi\n    else\n        free -h\n    fi\n    echo \"===== NPU =====\"\n
            \   if command -v npu-smi >/dev/null 2>&1; then\n        npu-smi info\n
            \   else\n        echo \"npu-smi not available\"\n    fi\n} 2>/dev/null
            || true\nif [ -n \"https://gitcode.com/Ascend/op-plugin.git\" ]; then\n
            \   CLONE_OK=true\n    git clone --single-branch -b \"master\" \"https://gitcode.com/Ascend/op-plugin.git\"
            \"$WORKSPACE\" || {\n        mkdir \"$WORKSPACE\" || echo \"WARNING: directory
            exists\"\n        echo \"WARNING: 主项目拉取失败！\"\n        CLONE_OK=false\n
            \   }\n    cd \"$WORKSPACE\"\n    if [ \"$CLONE_OK\" = \"true\" ]; then\n
            \       git fetch origin +refs/merge-requests/5697/head:pr\n        git
            config --global user.name \"robot\"\n        git config --global user.email
            \"your@emaple.com\"\n        git merge pr --no-ff -m \"Merge master from
            refs/merge-requests/5697/head\" || {\n            echo \"WARNING: 主项目merge失败！\"\n
            \       }\n    fi\nfi\ncat > .bazelrc << 'EOF'\n# Use GitHub BCR source
            as the registry\ncommon --registry=https://gh-proxy.test.osinfra.cn/https://raw.githubusercontent.com/bazelbuild/bazel-central-registry/main/\nEOF\n#!/bin/bash\nset
            -e\n# 工作目录清空\nrm -rf *\n# 下载CI仓代码\ngit clone -b master https://codehub.devcloud.cn-north-4.huaweicloud.com/a9b188a62f334fc0963bcfb523426d17/ci_gitcode.git
            cie\n# 代码预合并\nbash cie/common/common/merge.sh master https://gitcode.com/Ascend/op-plugin.git
            5697 /workspace\n# 生成modify_files.txt\npwd \ncd ./CODE\ngit diff-tree
            -r --name-only --no-commit-id origin/master HEAD > ../modify_files.txt\ncat
            ../modify_files.txt \ncd -\n# 执行UT脚本\nbash cie/common/UT/op-plugin_ut_general.sh
            v2.11.0 3.10 5697 /workspace master\n"
          command:
          - bash
