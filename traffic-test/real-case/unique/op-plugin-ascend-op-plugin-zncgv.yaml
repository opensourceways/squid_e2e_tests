            HEARTBEAT_FILE="$HEARTBEAT_FILE_PATH"
            TIMEOUT_SEC=$HEARTBEAT_TIMEOUT_SEC
            touch "$HEARTBEAT_FILE"
            MY_CGROUP=$(awk -F/ '{print $NF}' /proc/self/cgroup | head -1)
            COUNT=0
            while true; do
              LAST=$(stat -c %Y "$HEARTBEAT_FILE" 2>/dev/null || stat -f %m "$HEARTBEAT_FILE")
              NOW=$(date +%s)
              ELAPSED=$((NOW - LAST))
              if [ "$ELAPSED" -ge "$TIMEOUT_SEC" ]; then
                echo "Heartbeat timeout (${TIMEOUT_SEC}s). Killing all pod processes."
                for attempt in 1 2 3 4 5; do
                  for pid in $(ls /proc | grep -E '^[0-9]+$'); do
                    if [ "$pid" = "1" ]; then
                      continue
                    fi
                    CG=$(awk -F/ '{print $NF}' /proc/$pid/cgroup 2>/dev/null | head -1)
                    if [ "$CG" != "$MY_CGROUP" ]; then
                      kill -9 "$pid" 2>/dev/null || true
                    fi
                  done
                  sleep 2
                done
                echo "Killing PID 1."
                kill -9 1 2>/dev/null || true
                exit 1
              fi
              COUNT=$((COUNT + 1))
              if [ $((COUNT % 5)) -eq 0 ]; then
                REMAINING=$((TIMEOUT_SEC - ELAPSED))
                echo "Heartbeat remaining: ${REMAINING}s"
              fi
              sleep 1
            done
          command:
          - sh
          env:
