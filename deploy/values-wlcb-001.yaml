# 本文件是 **wlcb-001 集群**（乌兰花/乌兰察布-001）的 values 文件
#
# 部署时使用（ArgoCD 的 $values 源，或 helm -f）：
#   helm install squid ./chart -f values-wlcb-001.yaml -n squid --kubeconfig ~/.kube/wlcb-001.yaml
#
# 调度：nodeAffinity 绑定 192.168.1.191 + 192.168.1.49（amd64）。
# 192.168.1.49 带 label cache=true（无 taint）；191 无 cache label —— toleration 无副作用。
# caNamespaces 与线上 4 个命名空间（squid/op-plugin/mindspeed-mm/mindspeed-bridge）同步。
#
# Environment wlcb-001: production-grade resources, dual-active replicas
replicas: 2

nodeSelector:
  kubernetes.io/arch: amd64

nodeAffinity:
  requiredDuringSchedulingIgnoredDuringExecution:
    nodeSelectorTerms:
    - matchExpressions:
      - key: kubernetes.io/hostname
        operator: In
        values:
        - 192.168.1.49

tolerations:
- key: cache
  operator: Equal
  value: "true"
  effect: NoSchedule

squid:
  maxObjectSize: 8192
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2
      memory: 4Gi

registryProxy:
  proxyReadTimeout: "300s"
  proxySendTimeout: "300s"
  proxyConnectReadTimeout: "300s"
  sendTimeout: "300s"
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 8
      memory: 16Gi

persistence:
  squidCache:
    size: 50Gi
    storageClass: harbor-subpath-sc
  registryCache:
    size: 200Gi
    storageClass: harbor-subpath-sc

secretDefinition:
  enabled: true
  vaultPath: secrets/data/ascend/ci
  caBundleKey: squid_ca_bundle_v3_prod_pem
  caPublicKey: squid_ca_v3_prod_pem
  caTruststoreKey: squid_bazel_trust_v3_prod_jks
  caNamespaces:
  - squid
  - argo
  - ragsdk
  - op-plugin
  - recsdk
  - multimodalsdk
  - indexsdk
  - mindstudio
  - slime-ascend
  - mindspeed
  - megatronadaptor
  - mindspeed-llm
  - mindspeed-mm
  - mindspeed-bridge
  - mindspeed-ops
  - drivingsdk
  - fsdpturbo
  - openubmc
  - memfabric-hybrid
  - memcache
  - cann
  - ascend-data-sync
