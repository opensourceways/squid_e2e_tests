apiVersion: v1
kind: ConfigMap
metadata:
  name: squid-config
  namespace: {{ .Values.namespace }}
data:
  squid.conf: |
    # ── 监听端口 + SSL Bump ──
    http_port 3129 ssl-bump \
      cert=/etc/squid/ssl_cert/squid-ca-bundle.pem \
      generate-host-certificates=on \
      dynamic_cert_mem_cache_size=8MB \
      tls-min-version=1.0 \
      tls-cipher=DEFAULT:@SECLEVEL=0

    visible_hostname squid-cache

    # ── SSL 证书生成器 ──
    sslcrtd_program /usr/local/squid/libexec/security_file_certgen -s /var/cache/squid-ssl-db -M 8MB
    sslcrtd_children 8 startup=1 idle=1

    # ── SSL Bump 规则（client-first：step1 即定 splice/bump，不连 origin 取证书）──
    # 2026-09-15 方案A：server-first（peek→bump）在 CONNECT 阶段先连 origin 仿冒证书，
    # server 连接被 PINNED → bump 后 GET 跳过全部 cache_peer（JUDGEMENT.md 修订①）。
    # client-first 在 step1 直接决策：
    #   - registry 域 → splice（隧道不解密）；step1 无 SNI，用 dstdomain 判 CONNECT authority
    #   - 其余域 → bump；假证书由 sslcrtd 按 CONNECT 主机名签发（CN/SAN=主机名，不再仿冒
    #     origin subject/SAN；客户端信任注入的 CA 即可接受）
    #   - bump 后 GET 是普通代理请求 → 走完整 peer_select → cache_peer 对 https 生效
    # registry 域名白名单：与 .Values.registryProxy.registries 同源，改动只改 values、无需 bump chart
    {{- range $d := splitList " " .Values.registryProxy.registries }}
    acl registry dstdomain {{ $d }}
    {{- end }}

    ssl_bump splice registry
    ssl_bump bump all

    # ── 访问控制 ──
    acl localnet src all
    http_access allow localnet
    http_access deny all

    # ── §4.3 registry 缓存 peer（同 Pod 的 rpardini sidecar，localhost:3128）──
    cache_peer 127.0.0.1 parent 3128 0 no-query no-digest name=registryproxy
    cache_peer_access registryproxy allow registry
    cache_peer_access registryproxy deny all
    never_direct allow registry

    # ── §4.4 回源缓存 peer（集群内 nginx 分片缓存，values squid.cachePeer）──
    # 前提：client-first bump（见文件头 SSL Bump 注释）——server-first 下 https GET 被 PINNED，
    # peer 结构性不可用且 never_direct 会造成必然 503（JUDGEMENT.md 修订①）。
    # originserver：squid 默认以 absolute-form 转发 peer（GET https://pypi.org/...），
    # nginx 不接受 https 绝对形式且 $request_uri 被污染 → 强制 origin-form
    # （GET /simple/... + Host: pypi.org），nginx 按路径正常承接（cachepeer P1 实测 200）。
    # never_direct 硬强制：peer 挂 = fail-closed 快速失败（client-first 下语义可控，P6 可验）。
    {{- if .Values.squid.cachePeer.enabled }}
    acl CONNECT method CONNECT
    {{- range $p := .Values.squid.cachePeer.peers }}
    cache_peer {{ $.Values.squid.cachePeer.host }} parent {{ $p.port }} 0 no-query no-digest originserver name={{ $p.name }}
    acl {{ $p.name | replace "-" "_" }}_dom dstdomain {{ $p.domains }}
    cache_peer_access {{ $p.name }} deny CONNECT
    cache_peer_access {{ $p.name }} allow {{ $p.name | replace "-" "_" }}_dom
    cache_peer_access {{ $p.name }} deny all
    never_direct allow {{ $p.name | replace "-" "_" }}_dom !CONNECT
    {{- end }}
    {{- end }}

    # ── §4.5 url_rewrite（client-first 下 https 域透明重写，2026-09-15 转正）──
    # helper 见本 CM 末尾 rewrite-helper.sh（values squid.urlRewrite）。重写发生在 peer_select
    # 之前：被重写域（pypi/go/apt/github archive）的 cache_peer 永不命中，勿同时配置。
    # helper 失败语义：全灭 1s 内自动重生、期间原样放行（P5 破坏性实测零 5xx）。
    {{- if .Values.squid.urlRewrite.enabled }}
    # /bin/sh 前缀：CM 挂载文件无 exec 位（0644），直接 exec 会失败 → sh 解释执行
    url_rewrite_program /bin/sh /etc/squid/rewrite-helper.sh
    url_rewrite_children 8 startup=1 idle=2
    {{- end }}

    # ── 缓存配置 ──
    cache_mem {{ .Values.squid.cacheMemory }} MB
    maximum_object_size_in_memory 512 KB
    cache_dir ufs /var/spool/squid {{ .Values.squid.cacheDiskSize }} 16 8
    maximum_object_size {{ .Values.squid.maxObjectSize }} MB

    # ── 缓存策略 ──
    # Immutable build artifacts: never revalidate, ignore client reloads,
    # ignore origin Expires/max-age and no-store. NOTE (verified on squid 7.6):
    #   - ignore-no-cache was REMOVED in squid 4+ (no-op, origin no-cache is
    #     enforced as must-revalidate) — do not re-add it.
    #   - override-vary is unknown in 7.6 (logs ERROR) — do not re-add it.
    #   - override-expire/ignore-reload/ignore-private/ignore-no-store are
    #     legacy-but-effective (squid logs a "violates HTTP" WARNING).
    #   - immutable 资格只给「内容寻址 + 源站不可覆盖」(A类) 对象；
    #     ref 寻址/可覆盖 (B类) 走短 TTL（见 CACHE-STRATEGY.md §7）。
    refresh_pattern -i \.whl$  10080 100% 525600 ignore-reload override-expire ignore-no-store
    refresh_pattern -i \.crate$ 10080 100% 525600 ignore-reload override-expire ignore-no-store
    refresh_pattern -i \.deb$  10080 100% 525600 ignore-reload override-expire ignore-no-store
    # npm tarball / RPM immutable 长缓存（no-mirror-test 规则 6/11 键漂移配套；npm 元数据与
    # rsproxy index 走 .crate$/catch-all 已覆盖）
    refresh_pattern -i registry\.npmmirror\.com/.*\.tgz$ 10080 100% 525600 ignore-reload override-expire ignore-no-store
    refresh_pattern -i \.rpm$  10080 100% 525600 ignore-reload override-expire ignore-no-store
    # Go 发行版 tarball（helper 规则 5b 键漂移配套：go.dev/dl、dl.google.com/go →
    # mirrors.aliyun.com/golang；发行版 immutable，文件名唯一）
    refresh_pattern -i mirrors\.aliyun\.com/golang/go1\..*\.tar\.gz$ 10080 100% 525600 ignore-reload override-expire ignore-no-store
    # B 类可变内容（权重/分支归档）：尊重 LM 老化，不强制 fresh
    refresh_pattern -i \.(pth|pt|safetensors)$ 0 20% 4320
    refresh_pattern -i codeload\.github\.com/.*/refs/heads/ 0 20% 4320
    refresh_pattern -i codeload\.github\.com/.*/refs/tags/ 10080 100% 525600 ignore-reload override-expire ignore-no-store
    # github.com 原始 host 规则同时命中两类键（无锚点子串匹配）：
    #   ① 重写键（client-first + url_rewrite，2026-09-15 转正）：gh-proxy 前缀 URL 内嵌
    #      原始 github.com URL 全文，github.com/.../ 子串在重写键中依然存在——无需
    #      gh-proxy 前缀版规则（曾经的 ghProxyHost 前缀写法对 releases 是死代码：
    #      本条更靠前、首匹配生效，archive/releases 两类都由本条接管）；
    #   ② 降级键：helper 全灭 1s 自愈窗口流量原样放行，键=原始 URL，同一规则兜底。
    # tags=immutable 长缓存；heads/分支可变走上方 codeload 短 TTL 对应逻辑。
    refresh_pattern -i github\.com/.*/archive/refs/tags/ 10080 100% 525600 ignore-reload override-expire ignore-no-store
    refresh_pattern -i github\.com/.*/releases/download/ 10080 100% 525600 ignore-reload override-expire ignore-no-store
    # 索引/元数据（20% 老化匹配同步频率）
    refresh_pattern -i repo\.huaweicloud\.com/.*/simple/ 0 20% 4320 ignore-private ignore-reload
    # 纯 rewrite 键漂移配套（redirect/gh-proxy/clientfirst-rewrite）：apt 域经 helper
    # host-swap 后键=huaweicloud，原 .ubuntu.com 规则不再命中——补同参数规则
    refresh_pattern -i repo\.huaweicloud\.com/(ubuntu|ubuntu-ports)/ 0 20% 4320 ignore-private
    # tuna 不再是 pypi 重写目标（2026-09-16 起 pypi→huaweicloud），但客户端显式 -i tuna 直连
    # 的流量不经 helper，键仍为 tuna——保留兜底，避免落到 catch-all 逐次回源
    refresh_pattern -i mirrors\.tuna\.tsinghua\.edu\.cn/.*/simple/ 0 20% 4320 ignore-private ignore-reload
    refresh_pattern -i \.pypi\.org/.* 0 20% 4320 ignore-private
    refresh_pattern -i \.golang\.org/.* 0 20% 4320 ignore-private
    refresh_pattern -i proxy\.golang\.org/.* 0 20% 4320 ignore-private
    refresh_pattern -i \.debian\.org/.* 0 20% 4320 ignore-private
    refresh_pattern -i \.ubuntu\.com/.* 0 20% 4320 ignore-private
    # catch-all：0 0% 0 → min/percent/max 全零，任何缓存对象立即 STALE → 每次请求都回源再验证
    # （官方判定链：expire? age>max? lm-factor<percent? age<min? 四条全 STALE）；
    # 无 validator（无 Last-Modified/ETag）的响应默认不缓存，天然直通。
    # refresh-ims：客户端发 If-Modified-Since 时强制 squid 回源（而非拿缓存答客户端）。
    # 杜绝串台/脏数据；命中上面专属规则的仍按各自 TTL。
    refresh_pattern . 0 0% 0 refresh-ims

    # ── 响应头处理（消除 Vary: Origin 导致的缓存 miss）──
    reply_header_replace Vary Accept-Encoding

    # ── 日志（tail -F → kubectl logs 可见）──
    # logfile_rotate 10：access.log / cache.log 各保留 10 份历史后轮转，防容器层日志无限膨胀
    logfile_rotate 10
    access_log daemon:/var/log/squid/access.log
    cache_log /var/log/squid/cache.log
    cache_store_log none

    pid_filename /var/run/squid/squid.pid

    # ── 超时设置（支持 5GB+ 大镜像下载）──
    # connect_timeout 5s: 多 IP 顺序 failover 需在客户端超时预算(典型 curl --max-time 6)内
    # 完成"判死坏 IP→换下一个→建连"；原 2 minutes 判死过慢导致 proxy 路径系统性劣于直连
    # (A/B 实测与机理见 domaintest/REPORT-proxy-vs-direct.md、REPORT-connect-timeout-ab.md)
    # dns_v4_first 在 Squid 7 已废弃(地址族回退自动化)，不配置；IPv6 挂起由 5s 超时兜底
    read_timeout 30 minutes
    write_timeout 30 minutes
    connect_timeout 5 seconds
    request_timeout 10 minutes

    # ── 禁止 quick_abort（防大文件传输中途截断）──
    quick_abort_min -1 KB
    quick_abort_max -1 KB
    quick_abort_pct 95

  # ── url_rewrite helper（与 squid.conf 同 CM：helper 规则与上方 refresh_pattern 键强耦合，
  #    必须同步滚动；STS 从同一 squid-config volume 以 subPath 再挂 /etc/squid/rewrite-helper.sh）──
  # ⚠️ 本键恒在、不受 urlRewrite.enabled 门控（2026-09-17 false 分支事故）：enabled 只控
  #    squid.conf 里的 url_rewrite_program 行。若连键一起摘，live Pod 的 subPath 挂载会
  #    FailedMount（config references non-existent key），且与 STS 缩减挂载的三方合并
  #    FailedCreate 互相锁死。enabled=false 时文件仍在但 squid 不加载它，无害。
  rewrite-helper.sh: |
    #!/bin/sh
    # squid url_rewrite helper（client-first bump 下 https 域透明重写，2026-09-15 转正）
    # 机制（详见 redirect/gh-proxy/clientfirst-rewrite/TEST-WORKFLOW.md）：
    #   client-first bump 在 step1 直接决策不连 origin → bump 后 GET 无 pinned 连接 →
    #   重写后按新目的地新建 TLS 连接 → server-first 时代 301/421（PINNED 复用）结构性
    #   缺陷不复现（修订⑥需限定为 server-first 专属）。
    # 协议（squid 5+，url_rewrite_children 未配 concurrency → 无 channel-ID）：
    #   输入：<URL> [extras]；输出：OK rewrite-url="新URL"（改写）/ OK（不改写）/ ERR
    #
    # 规则边界（对齐 SOURCE-REWRITE-ANALYSIS.md + redirect/no-mirror-test，2026-09-15 定稿）：
    #   1. pypi 索引 → repo.huaweicloud.com/repository/pypi/simple/（2026-09-15 用户拍板
    #      与 apt 统一走华为云；实测验证形态 tuna 见 JUDGEMENT 修订⑦）。华为云 /simple 页面
    #      href 为相对路径 ../../packages/* → pip 解析回 repo.huaweicloud.com 同域对象
    #      = 索引×对象同源，无混源；wheel 缓存由 .whl$ 规则覆盖
    #   2. files.pythonhosted/packages → 华为云 packages 同构 host 交换（对象域兜底：客户端
    #      硬编码官方对象 URL 时仍落华为云；路径结构完全同构）
    #   3. archive / releases/download → gh-proxy 前缀：gh-proxy 直接认两形态（实测 200），
    #      服务端吸收 302，请求不打 github.com:443（绕开限流）；键=gh-proxy URL，配合上方
    #      gh-proxy refresh_pattern 实现 TCP_HIT。git clone / API 不重写（clone 实验 TODO
    #      见 redirect/no-mirror-test §8；raw → gh-proxy 已覆盖，见规则 10）
    #   4. raw.githubusercontent → gh-proxy 前缀（gh-proxy 白名单支持 raw 形态）
    #   5. go → goproxy.cn（sumdb 校验走 GOPROXY 路径一并重写，无需 GOSUMDB）；
    #      Go 发行版 tarball（go.dev/dl、dl.google.com/go）→ mirrors.aliyun.com/golang
    #      （路径同构、文件名唯一；老 go GOTOOLCHAIN 解析缺陷与重写无关）
    #   6. apt → 华为云 host 交换（相对路径源，索引/对象全由客户端从 base 拼相对路径生成，
    #      host 交换结构上无混源；apt 校验 InRelease/SHA256SUMS 兜底；键漂移由上方
    #      huaweicloud refresh_pattern 补齐）
    #   7. npm → npmmirror host 交换（路径完全同构；tarball immutable，.tgz 长缓存见上方）
    #   8. cargo → rsproxy：index.crates.io→rsproxy/index（sparse index 可达），其 config.json
    #      的 dl 指回 rsproxy/crates → tarball 随之透明；static.crates.io/crates 兜底显式请求；
    #      .crate$ 长缓存规则已有
    #   9. conda → nju：conda.anaconda.org→anaconda/cloud/<ch>、repo.anaconda.com/pkgs|
    #      miniconda→anaconda/（结构与 tuna 完全同构）。2026-09-16 由 tuna 换 nju：
    #      实测 nju 22~26MB/s vs tuna 2.5~4.8MB/s（6~7 倍差，tuna 链路拥堵抖动，
    #      曾现 271KB/s 回源事件，见 redirect/no-mirror-test/REPORT.md）
    #  10. openEuler yum → 华为云 host 交换（路径同构；.rpm immutable 长缓存见上方）
    #  11. pytorch / openmmlab / OBS / api.github.com 等官方源不重写（官方可达或无同构镜像）
    #  12. 白名单外原样放行（OK）；helper 全灭时 squid 1s 内重生、期间原样放行（P5 实测零失败）
    while read -r url _rest; do
      case "$url" in
        https://pypi.org/simple/*)
          echo "OK rewrite-url=\"https://repo.huaweicloud.com/repository/pypi/simple/${url#https://pypi.org/simple/}\"" ;;
        https://files.pythonhosted.org/packages/*)
          echo "OK rewrite-url=\"https://repo.huaweicloud.com/repository/pypi/packages/${url#https://files.pythonhosted.org/packages/}\"" ;;
        https://github.com/*/archive/*|https://github.com/*/releases/download/*)
          echo "OK rewrite-url=\"https://{{ .Values.squid.urlRewrite.ghProxyHost }}/${url}\"" ;;
        https://raw.githubusercontent.com/*)
          echo "OK rewrite-url=\"https://{{ .Values.squid.urlRewrite.ghProxyHost }}/${url}\"" ;;
        https://proxy.golang.org/*)
          echo "OK rewrite-url=\"https://goproxy.cn/${url#https://proxy.golang.org/}\"" ;;
        https://go.dev/dl/*|https://dl.google.com/go/*)
          # Go 官方版本分发。内含两类路径，必须分流处理：
          case "$url" in
            *\?mode=json*)
              # 版本查询 API（pre-commit golang hook _infer_go_version 要拿真 JSON，
              # 重写到 aliyun 会拿到 HTML 目录页 → JSONDecodeError，2026-09-20 gy-002 CI 实锤）。
              # 重写到 Google 官方中国镜像（同路径同 JSON），实测 ~0.5s 稳定，
              # 优于 go.dev 直连（~1-2s 抖动）；保留 include=all 等完整 query
              echo "OK rewrite-url=\"https://golang.google.cn/dl/${url#*dl/}\"" ;;
            *)
              # 发行版 tarball（dl.google.com egress 被墙）→ 阿里云 golang 镜像路径同构
              # （/<file> 一致，文件名全局唯一）；tarball immutable，长缓存见上方 refresh_pattern
              echo "OK rewrite-url=\"https://mirrors.aliyun.com/golang/${url##*/}\"" ;;
          esac ;;
        *://archive.ubuntu.com/*)
          echo "OK rewrite-url=\"${url%%://*}://repo.huaweicloud.com/${url#*archive.ubuntu.com/}\"" ;;
        *://ports.ubuntu.com/*)
          echo "OK rewrite-url=\"${url%%://*}://repo.huaweicloud.com/${url#*ports.ubuntu.com/}\"" ;;
        https://registry.npmjs.org/*)
          echo "OK rewrite-url=\"https://registry.npmmirror.com/${url#https://registry.npmjs.org/}\"" ;;
        https://index.crates.io/*)
          echo "OK rewrite-url=\"https://rsproxy.cn/index/${url#https://index.crates.io/}\"" ;;
        https://static.crates.io/crates/*)
          # static.crates.io 兜底映射（显式请求官方对象域的客户端）。rsproxy 真实下载
          # 形态（2026-09-20 路径同构性实测，redirect/pathtest）：index config.json
          #   dl=https://rsproxy.cn/api/v1/crates → /<crate>/<ver>/download → 307
          #   → lf*-static.rsproxy.cn。旧映射 rsproxy/crates/<crate>/<file> 已 404 失效。
          # 文件名按 crates.io 规则切分：最后一个 '-' 之前为 crate 名、之后为版本
          _f=${url##*/}; _crate=${_f%-*}; _ver=${_f##*-}; _ver=${_ver%.crate}
          echo "OK rewrite-url=\"https://rsproxy.cn/api/v1/crates/${_crate}/${_ver}/download\"" ;;
        https://conda.anaconda.org/*)
          echo "OK rewrite-url=\"https://mirror.nju.edu.cn/anaconda/cloud/${url#https://conda.anaconda.org/}\"" ;;
        https://repo.anaconda.com/pkgs/*|https://repo.anaconda.com/miniconda/*)
          echo "OK rewrite-url=\"https://mirror.nju.edu.cn/anaconda/${url#https://repo.anaconda.com/}\"" ;;
        *://repo.openeuler.org/*)
          echo "OK rewrite-url=\"${url%%://*}://mirrors.huaweicloud.com/openeuler/${url#*repo.openeuler.org/}\"" ;;
        *)
          echo "OK" ;;
      esac
    done
