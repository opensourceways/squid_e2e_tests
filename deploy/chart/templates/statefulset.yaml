apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: squid-cache
  namespace: {{ .Values.namespace }}
spec:
  serviceName: squid-cache-headless
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: squid-cache
  template:
    metadata:
      labels:
        app: squid-cache
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        {{- with .Values.nodeAffinity }}
        nodeAffinity:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: squid-cache
              topologyKey: kubernetes.io/hostname
      {{- if .Values.registryProxy.enabled }}
      initContainers:
      - name: ca-split
        image: {{ .Values.images.initContainer.repository }}:{{ .Values.images.initContainer.tag }}
        command:
        - /bin/sh
        - -c
        - |
          MIRROR={{ .Values.alpineMirror }}
          cat > /etc/apk/repositories <<EOF
          $MIRROR/main
          $MIRROR/community
          EOF
          apk add --no-cache openssl
          openssl x509 -in /src/squid-ca-bundle.pem -out /ca/ca.crt
          openssl pkey -in /src/squid-ca-bundle.pem -out /ca/ca.key
          echo "CA split done:" && ls -l /ca
        volumeMounts:
        - name: squid-ca
          mountPath: /src
          readOnly: true
        - name: registry-ca
          mountPath: /ca
      {{- end }}

      containers:
      - name: squid
        image: {{ .Values.images.squid.repository }}:{{ .Values.images.squid.tag }}
        imagePullPolicy: {{ .Values.images.squid.imagePullPolicy | default "IfNotPresent" }}
        ports:
        - containerPort: 3129
          name: proxy
        volumeMounts:
        - name: squid-config
          mountPath: /etc/squid/squid.conf
          subPath: squid.conf
        - name: squid-ca
          mountPath: /etc/squid/ssl_cert
          readOnly: true
        - name: cache
          mountPath: /var/spool/squid
        command:
        - /bin/sh
        - -c
        - |
          # 自建镜像（基于 squid-cache/squid 构建，squid 装到 /usr/local/squid，squid 用户 uid/gid=31）
          # 镜像已内置 squid 及依赖，无需 apk 安装；注意不是官方 squid-cache/squid 镜像。
          # squid 二进制编译默认 cache_log=/var/logs/cache.log（该目录不存在），
          # 必须显式指定到 /var/log/squid 并先建目录，否则 squid -z / squid 启动会失败。
          mkdir -p /var/log/squid
          if [ -f /etc/squid/ssl_cert/squid-ca-bundle.pem ]; then
            if [ ! -d /var/cache/squid-ssl-db ]; then
              /usr/local/squid/libexec/security_file_certgen \
                -c -s /var/cache/squid-ssl-db -M 8MB
              chown -R squid:squid /var/cache/squid-ssl-db 2>/dev/null || true
            fi
          fi

          MISSING=0
          for i in 00 01 02 03 04 05 06 07 08 09 0A 0B 0C 0D 0E 0F; do
            [ -d /var/spool/squid/$i ] || MISSING=1
          done
          if [ "$MISSING" = "1" ]; then
            printf 'cache_dir ufs /var/spool/squid {{ .Values.squid.cacheDiskSize }} 16 8\npid_filename /tmp/squid-init.pid\ncache_log /var/log/squid/cache.log\n' > /tmp/squid-init.conf
            squid -z -f /tmp/squid-init.conf 2>&1 || true
            rm -f /tmp/squid-init.pid 2>/dev/null || true
          fi

          rm -f /run/squid.pid /var/run/squid.pid /var/run/squid/squid.pid 2>/dev/null || true

          tail -F /var/log/squid/access.log &
          tail -F /var/log/squid/cache.log >&2 &

          exec squid -NYC
        readinessProbe:
          httpGet:
            path: /squid-internal-mgr/info
            port: 3129
            scheme: HTTP
          initialDelaySeconds: 20
          periodSeconds: {{ .Values.probes.readinessPeriodSeconds }}
          failureThreshold: {{ .Values.probes.readinessFailureThreshold }}
        livenessProbe:
          httpGet:
            path: /squid-internal-mgr/info
            port: 3129
            scheme: HTTP
          initialDelaySeconds: 60
          periodSeconds: {{ .Values.probes.livenessPeriodSeconds }}
          failureThreshold: {{ .Values.probes.livenessFailureThreshold }}
        resources:
          {{- toYaml .Values.squid.resources | nindent 10 }}

      {{- if .Values.exporter.enabled }}
      - name: squid-exporter
        image: {{ .Values.images.exporter.repository }}:{{ .Values.images.exporter.tag }}
        ports:
        - containerPort: {{ .Values.exporter.listenPort }}
          name: metrics
        env:
        - name: SQUID_HOSTNAME
          value: "127.0.0.1"
        - name: SQUID_PORT
          value: {{ .Values.exporter.squidPort | quote }}
        - name: SQUID_EXPORTER_LISTEN
          value: ":{{ .Values.exporter.listenPort }}"
        resources:
          {{- toYaml .Values.exporter.resources | nindent 10 }}
      {{- end }}

      {{- if .Values.registryProxy.enabled }}
      - name: registry-proxy
        image: {{ .Values.images.registryProxy.repository }}:{{ .Values.images.registryProxy.tag }}
        ports:
        - containerPort: 3128
          name: registry
        env:
        - name: REGISTRIES
          value: {{ .Values.registryProxy.registries | quote }}
        - name: ENABLE_MANIFEST_CACHE
          value: {{ .Values.registryProxy.enableManifestCache | quote }}
        - name: DISABLE_IPV6
          value: "true"
        - name: CACHE_MAX_SIZE
          value: {{ .Values.registryProxy.cacheMaxSize | quote }}
        - name: ALLOW_PUSH
          value: {{ .Values.registryProxy.allowPush | quote }}
        - name: PROXY_READ_TIMEOUT
          value: {{ .Values.registryProxy.proxyReadTimeout | quote }}
        - name: PROXY_SEND_TIMEOUT
          value: {{ .Values.registryProxy.proxySendTimeout | quote }}
        - name: PROXY_CONNECT_READ_TIMEOUT
          value: {{ .Values.registryProxy.proxyConnectReadTimeout | quote }}
        - name: SEND_TIMEOUT
          value: {{ .Values.registryProxy.sendTimeout | quote }}
        readinessProbe:
          httpGet:
            path: /
            port: 3128
            scheme: HTTP
          initialDelaySeconds: 15
          periodSeconds: {{ .Values.probes.readinessPeriodSeconds }}
          failureThreshold: {{ .Values.probes.readinessFailureThreshold }}
        livenessProbe:
          httpGet:
            path: /
            port: 3128
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: {{ .Values.probes.livenessPeriodSeconds }}
          failureThreshold: {{ .Values.probes.livenessFailureThreshold }}
        volumeMounts:
        - name: registry-ca
          mountPath: /ca
        - name: registry-cache
          mountPath: /docker_mirror_cache
        {{- if .Values.registryProxy.exporter.enabled }}
        # 仅当 registry-exporter 启用时才覆盖挂载 nginx 日志目录（与下方 volumes 中
        # nginx-access-log 的 emptyDir 条件一致）；否则 access.log 走镜像默认 /dev/stdout，
        # 避免出现"mount 引用了不存在的 volume"导致 StatefulSet 校验失败。
        - name: nginx-access-log
          # 覆盖镜像里的 access.log->/dev/stdout 符号链接，让 nginx 把 access_log 写成真实文件，
          # 供 registry-exporter 增量解析出 requests/hits/bytes 等计数指标（见 registry-exporter-configmap.yaml）
          mountPath: /var/log/nginx
        {{- end }}
        resources:
          {{- toYaml .Values.registryProxy.resources | nindent 10 }}
      {{- end }}

      {{- if and .Values.registryProxy.enabled .Values.registryProxy.exporter.enabled }}
      - name: registry-exporter
        image: {{ .Values.images.initContainer.repository }}:{{ .Values.images.initContainer.tag }}
        command: ["/bin/sh", "/script/exporter.sh"]
        ports:
        - containerPort: {{ .Values.registryProxy.exporter.listenPort }}
          name: regmetrics
        env:
        - name: REGISTRY_CACHE_MAX
          value: {{ .Values.registryProxy.cacheMaxSize | quote }}
        - name: REGISTRY_EXPORTER_INTERVAL
          value: {{ .Values.registryProxy.exporter.interval | quote }}
        - name: REGISTRY_EXPORTER_MAX_LOG_LINES
          value: {{ .Values.registryProxy.exporter.maxLogLines | quote }}
        volumeMounts:
        - name: registry-exporter-script
          mountPath: /script
          readOnly: true
        - name: registry-cache
          mountPath: /docker_mirror_cache
          readOnly: true
        - name: nginx-access-log
          # 与 registry-proxy 共享 nginx access.log（真实文件），并在此存 exporter 计数/偏移状态
          mountPath: /var/log/nginx
        resources:
          {{- toYaml .Values.registryProxy.exporter.resources | nindent 10 }}
      {{- end }}

      volumes:
      - name: squid-config
        configMap:
          name: squid-config
          items:
          - key: squid.conf
            path: squid.conf
      - name: squid-ca
        secret:
          secretName: squid-ca
          items:
          - key: squid-ca-bundle.pem
            path: squid-ca-bundle.pem
      {{- if .Values.registryProxy.enabled }}
      - name: registry-ca
        emptyDir: {}
      {{- end }}
      {{- if and .Values.registryProxy.enabled .Values.registryProxy.exporter.enabled }}
      - name: registry-exporter-script
        configMap:
          name: registry-exporter-script
      {{- end }}
      {{- if and .Values.registryProxy.enabled .Values.registryProxy.exporter.enabled }}
      - name: nginx-access-log
        # 上限 128Mi 兜底：exporter 每 30s 轮转日志，正常情况下远达不到该值；
        # 若轮转失效，emptyDir 撑满会触发 pod 驱逐（eviction），避免无限增长打满节点磁盘
        emptyDir:
          sizeLimit: 128Mi
      {{- end }}
  volumeClaimTemplates:
  - metadata:
      name: cache
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: {{ .Values.persistence.squidCache.storageClass }}
      resources:
        requests:
          storage: {{ .Values.persistence.squidCache.size }}
  {{- if .Values.registryProxy.enabled }}
  - metadata:
      name: registry-cache
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: {{ .Values.persistence.registryCache.storageClass }}
      resources:
        requests:
          storage: {{ .Values.persistence.registryCache.size }}
  {{- end }}
