{{- if .Values.secretDefinition.enabled }}
---
apiVersion: secrets-manager.tuenti.io/v1alpha1
kind: SecretDefinition
metadata:
  name: squid-ca
  namespace: {{ .Values.namespace }}
spec:
  name: squid-ca
  keysMap:
    squid-ca-bundle.pem:
      path: {{ .Values.secretDefinition.vaultPath }}
      key: {{ .Values.secretDefinition.caBundleKey }}
    squid-ca.pem:
      path: {{ .Values.secretDefinition.vaultPath }}
      key: {{ .Values.secretDefinition.caPublicKey }}
{{- range .Values.secretDefinition.caNamespaces }}
---
apiVersion: secrets-manager.tuenti.io/v1alpha1
kind: SecretDefinition
metadata:
  name: squid-ca-cert
  namespace: {{ . }}
spec:
  name: squid-ca-cert
  keysMap:
    squid-ca.pem:
      path: {{ $.Values.secretDefinition.vaultPath }}
      key: {{ $.Values.secretDefinition.caPublicKey }}
{{- end }}
{{- end }}
