namespace: squid

# Dual-active replicas: every pod runs squid + registry-proxy with its OWN
# cache PVC (volumeClaimTemplates). Traffic is load-balanced by the Service;
# if one pod dies the other keeps serving - no failover window.
replicas: 2
nodeSelector: {}
nodeAffinity: {}

# Image pull secrets (e.g. huawei-swr-image-pull-secret-model-gy) for pulling
# images from the private SWR registry.
imagePullSecrets: []

# Probe tuning. readiness drives Service endpoint membership, so keep it
# fast: 5s x 2 = worst-case ~10s to drop a dead endpoint (HTTP cachemgr
# check, not TCP - catches stuck-but-listening squid).
probes:
  readinessPeriodSeconds: 5
  readinessFailureThreshold: 2
  livenessPeriodSeconds: 10
  livenessFailureThreshold: 3

images:
  squid:
    repository: swr.cn-southwest-2.myhuaweicloud.com/modelfoundry/squid-cache/squid
    tag: "v7.7.1"
    # 默认 IfNotPresent；需要强制拉最新镜像的集群（如 006 自建镜像调试期）覆写为 Always
    imagePullPolicy: IfNotPresent
  registryProxy:
    repository: swr.cn-southwest-2.myhuaweicloud.com/modelfoundry/rpardini/docker-registry-proxy
    tag: "0.6.5"
  initContainer:
    repository: swr.cn-southwest-2.myhuaweicloud.com/modelfoundry/alpine
    tag: "3.23.3"
  exporter:
    repository: swr.cn-southwest-2.myhuaweicloud.com/modelfoundry/boynux/squid-exporter
    tag: "v1.13.0"

alpineMirror: "https://mirrors.huaweicloud.com/alpine/v3.23"

squid:
  cacheMemory: 512
  cacheDiskSize: 20480
  maxObjectSize: 8192
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2
      memory: 4Gi
  # ── 回源缓存 peer（集群内 nginx-pypi-cache/cache-service，按端口分片）──
  # 选路不改 URL：squid 按目标域把请求原样转发给 peer（origin-form + 原 Host），
  # 缓存键不变——从机制上避开 url_rewrite 在 ssl-bump 下的连接复用缺陷
  # （见 redirect/gh-proxy/JUDGEMENT.md 修订⑥、redirect/cachepeer/TEST-WORKFLOW.md）。
  # ⚠️ 前提：client-first bump（2026-09-15 方案A）。server-first（peek→bump）下 https GET 被
  # PINNED 到 origin 连接、选路跳过全部 peer，且 never_direct 会把 pinned 直连拦成必然 503
  # （cachepeer/JUDGEMENT.md 修订①）——client-first 化解此约束后 https 域才可配 peer。
  # originserver：peer 为 origin 形态 nginx，强制 origin-form 转发（absolute-form https
  # 会被 nginx 拒绝/污染 $request_uri）。
  # 端口归属实测（2026-09-08 P0 勘验 + 2026-09-15 8086 注入）：
  #   8081=deb(repo.huaweicloud.com) 8082=rustup 8083=yum/openEuler 8084=go(goproxy.cn)
  #   8085=crates 8086=pypi origin-form（/simple→huaweicloud，fallback pypi.org；/packages→pythonhosted）
  # ⚠️ never_direct 是硬强制：peer 挂掉时对应域 fail-closed（快速失败，不回官方源）
  cachePeer:
    enabled: false
    host: cache-service.nginx-pypi-cache.svc.cluster.local
    peers: []
    # 每项 = 一个 peer：name（squid peer/ACL 标识）、port、domains（dstdomain 空格分隔清单）
    # 示例（gy-006 实测可用）：
    # - name: apt-peer
    #   port: 8081
    #   domains: ".archive.ubuntu.com .security.ubuntu.com .ports.ubuntu.com .debian.org"
    # - name: go-peer
    #   port: 8084
    #   domains: ".proxy.golang.org"
  # url_rewrite 透明重写（2026-09-15 转正，详见 redirect/gh-proxy/clientfirst-rewrite/TEST-WORKFLOW.md）
  # client-first bump 下 https 重写复活（无 PINNED，修订⑥需限定 server-first）；helper 由
  # squid-rewrite-helper CM 提供。被重写域的 cache_peer 永不命中，勿与 cachePeer 同域配置。
  urlRewrite:
    enabled: false
    # github archive/releases 重写目标（gh-proxy 前缀），configmap.yaml 的 refresh_pattern 同源
    ghProxyHost: gh-proxy.test.osinfra.cn

exporter:
  enabled: true
  # boynux/squid-exporter reads Squid stats via the cachemgr HTTP endpoint
  # (http://127.0.0.1:3129/squid-internal-mgr/info), no SNMP required.
  squidPort: 3129
  listenPort: 9301
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

registryProxy:
  enabled: true
  # 域名白名单（空格分隔）：同时作为 rpardini 代理/缓存清单 和 squid.conf `acl registry` 的输入。
  # 增删域名只改这里即可，无需 bump chart 版本。
  registries: "harbor-portal.test.osinfra.cn harbor-portal.osinfra.cn swr.cn-south-1.myhuaweicloud.com swr.cn-north-4.myhuaweicloud.com swr.cn-southwest-2.myhuaweicloud.com swr.cn-north-12.myhuaweicloud.com registry.k8s.io ghcr.io gcr.io quay.io"
  enableManifestCache: "false"
  cacheMaxSize: "100g"
  allowPush: "true"
  proxyReadTimeout: "300s"
  proxySendTimeout: "300s"
  proxyConnectReadTimeout: "300s"
  sendTimeout: "300s"
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 2
      memory: 2Gi
  # registry-proxy 缓存指标 exporter：增量解析 nginx access.log（经 emptyDir 覆盖挂载 /var/log/nginx 转成真实文件）
  # 出 requests/errors/hits/misses/bytes_out/状态码分布，叠加只读缓存卷的 blob 数/磁盘水位。
  # 注：日志无 request_length，故无 bytes_in；详见 registry-exporter-configmap.yaml
  exporter:
    enabled: false
    listenPort: 9302
    interval: 30
    # 日志行数阈值，超过即轮转（清空已全部解析的 access.log），上限约 30~40MB
    maxLogLines: 100000
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 64Mi

# Per-pod cache PVCs (created via volumeClaimTemplates). Each replica has
# its own RWO volume - no shared write path, no arbitration needed.
persistence:
  squidCache:
    size: 50Gi
    storageClass: sfsturbo-subpath-sc
  registryCache:
    size: 200Gi
    storageClass: sfsturbo-subpath-sc

secretDefinition:
  enabled: false
  vaultPath: secrets/data/ascend/ci
  caBundleKey: squid_ca_bundle_v3_pem
  caPublicKey: squid_ca_v3_pem
  caTruststoreKey: squid_bazel_trust_v3_jks
  caNamespaces: []
  # - buildkitd
  # - ascend-gha-runners
