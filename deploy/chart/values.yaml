namespace: squid

# Dual-active replicas: every pod runs squid + registry-proxy with its OWN
# cache PVC (volumeClaimTemplates). Traffic is load-balanced by the Service;
# if one pod dies the other keeps serving - no failover window.
replicas: 2
nodeSelector: {}
nodeAffinity: {}

# Image pull secrets (e.g. huawei-swr-image-pull-secret-model-gy) for pulling
# images from the private SWR registry.
imagePullSecrets: []

# Probe tuning. readiness drives Service endpoint membership, so keep it
# fast: 5s x 2 = worst-case ~10s to drop a dead endpoint (HTTP cachemgr
# check, not TCP - catches stuck-but-listening squid).
probes:
  readinessPeriodSeconds: 5
  readinessFailureThreshold: 2
  livenessPeriodSeconds: 10
  livenessFailureThreshold: 3

images:
  squid:
    repository: swr.cn-southwest-2.myhuaweicloud.com/modelfoundry/squid-cache/squid
    tag: "v7.7.1"
    # 默认 IfNotPresent；需要强制拉最新镜像的集群（如 006 自建镜像调试期）覆写为 Always
    imagePullPolicy: IfNotPresent
  registryProxy:
    repository: swr.cn-southwest-2.myhuaweicloud.com/modelfoundry/rpardini/docker-registry-proxy
    tag: "0.6.5"
  initContainer:
    repository: swr.cn-southwest-2.myhuaweicloud.com/modelfoundry/alpine
    tag: "3.23.3"
  exporter:
    repository: swr.cn-southwest-2.myhuaweicloud.com/modelfoundry/boynux/squid-exporter
    tag: "v1.13.0"

alpineMirror: "https://mirrors.huaweicloud.com/alpine/v3.23"

squid:
  cacheMemory: 512
  cacheDiskSize: 20480
  maxObjectSize: 8192
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2
      memory: 4Gi

exporter:
  enabled: true
  # boynux/squid-exporter reads Squid stats via the cachemgr HTTP endpoint
  # (http://127.0.0.1:3129/squid-internal-mgr/info), no SNMP required.
  squidPort: 3129
  listenPort: 9301
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

registryProxy:
  enabled: true
  registries: "swr.cn-north-4.myhuaweicloud.com swr.cn-southwest-2.myhuaweicloud.com registry.k8s.io ghcr.io gcr.io quay.io"
  enableManifestCache: "false"
  cacheMaxSize: "100g"
  allowPush: "true"
  proxyReadTimeout: "300s"
  proxySendTimeout: "300s"
  proxyConnectReadTimeout: "300s"
  sendTimeout: "300s"
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 2
      memory: 2Gi
  # registry-proxy 缓存指标 exporter：增量解析 nginx access.log（经 emptyDir 覆盖挂载 /var/log/nginx 转成真实文件）
  # 出 requests/errors/hits/misses/bytes_out/状态码分布，叠加只读缓存卷的 blob 数/磁盘水位。
  # 注：日志无 request_length，故无 bytes_in；详见 registry-exporter-configmap.yaml
  exporter:
    enabled: false
    listenPort: 9302
    interval: 30
    # 日志行数阈值，超过即轮转（清空已全部解析的 access.log），上限约 30~40MB
    maxLogLines: 100000
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 64Mi

# Per-pod cache PVCs (created via volumeClaimTemplates). Each replica has
# its own RWO volume - no shared write path, no arbitration needed.
persistence:
  squidCache:
    size: 50Gi
    storageClass: sfsturbo-subpath-sc
  registryCache:
    size: 200Gi
    storageClass: sfsturbo-subpath-sc

secretDefinition:
  enabled: false
  vaultPath: secrets/data/ascend/ci
  caBundleKey: squid_ca_bundle_v3_pem
  caPublicKey: squid_ca_v3_pem
  caTruststoreKey: squid_bazel_trust_v3_jks
  caNamespaces: []
  # - buildkitd
  # - ascend-gha-runners
