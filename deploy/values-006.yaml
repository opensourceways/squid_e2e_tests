# ⚠️ 本文件是 **gy-006 集群**（openmerlin-guiyang-006）的 values 文件 —— the value of gy-006
#
# 部署时使用（ArgoCD 的 $values 源，或 helm -f）：
#   helm install squid ./chart -f values-006.yaml -n squid --kubeconfig ~/.kube/gy-006.yaml
#
# 与 ascend-ci-deployment/argocd/clusters/squid-rpardini/values-006.yaml 保持同步。
# 其他集群的值：values-cn12-001.yaml（cn12-001）、values-hk-001.yaml（hk-001）。
#
# Environment 006: production-grade resources, dual-active replicas
replicas: 2

nodeSelector:
  kubernetes.io/arch: amd64

squid:
  maxObjectSize: 8192
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2
      memory: 4Gi
  # ⚠️ cache_peer 全部摘除（2026-09-15 用户拍板"架构收纯 rewrite"，redirect/gh-proxy/
  # clientfirst-rewrite/）：
  # - go-peer/pypi-peer：client-first bumped GET 对明文 peer 强制 TLS → 503 wrong version
  #   number（05 用例 C-obj 实锤）；pypi/go 流量改 rewrite（tuna / goproxy.cn）
  # - apt-peer：同日摘除，apt 改 helper host-swap → repo.huaweicloud.com（helper 死 1s 自愈
  #   降级直连，优于 cache-service 单点 fail-closed 硬 503）；键漂移由 chart 补 huaweicloud
  #   ubuntu refresh_pattern 配套
  # - registryproxy 不受影响（rpardini sidecar，CONNECT-capable 形态，机制不同，保留）
  # cache-service 8081/8084/8086 端口保留，回切 = values 里重配 cachePeer（chart 默认已内置
  # enabled:false 骨架与 peers 语法示例，历史实测见 redirect/cachepeer/JUDGEMENT.md）

  # 纯 rewrite 架构（2026-09-15 转正，8 用例实测全绿见 redirect/test/）：
  #   pypi index→huaweicloud / github archive+releases→gh-proxy / go→goproxy.cn / apt→huaweicloud
  #   registry splice 与白名单外流量原样放行；helper 全灭 1s 自愈、降级直连（P5 实测）
  urlRewrite:
    enabled: true
    ghProxyHost: gh-proxy.test.osinfra.cn

images:
  squid:
    # AKI 补丁版（gadgets.cc-aki.patch，2026-09-16）：client-first 伪造证书补 AKI，
    # 修复 Python 3.13+/conda 26 strict 校验拒签，见 redirect/squid-aki-test/PLAN.md
    tag: "v7.7.2"
    # 自建镜像调试期强制拉取最新，避免命中节点上旧的 v7.7.1 标签镜像
    imagePullPolicy: Always

registryProxy:
  # registry 域 splice 到同 Pod 的 rpardini sidecar，blob 缓存 100G（PVC 200Gi）
  cacheMaxSize: "100g"
  proxyReadTimeout: "300s"
  proxySendTimeout: "300s"
  proxyConnectReadTimeout: "300s"
  sendTimeout: "300s"
  exporter:
    # 仓库缓存指标 exporter（只读缓存卷，出 blob 数/磁盘水位），见 registry-exporter-configmap.yaml
    enabled: true
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 8
      memory: 16Gi

persistence:
  squidCache:
    size: 50Gi
  registryCache:
    size: 200Gi

secretDefinition:
  enabled: true
  vaultPath: secrets/data/ascend/ci
  caBundleKey: squid_ca_bundle_v3_pem
  caPublicKey: squid_ca_v3_pem
  caNamespaces:
  - buildkitd
  - ascend-gha-runners
  - nv-action
  - squid
