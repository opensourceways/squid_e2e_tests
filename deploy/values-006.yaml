# ⚠️ 本文件是 **gy-006 集群**（openmerlin-guiyang-006）的 values 文件 —— the value of gy-006
#
# 部署时使用（ArgoCD 的 $values 源，或 helm -f）：
#   helm install squid ./chart -f values-006.yaml -n squid --kubeconfig ~/.kube/gy-006.yaml
#
# 与 ascend-ci-deployment/argocd/clusters/squid-rpardini/values-006.yaml 保持同步。
# 其他集群的值：values-cn12-001.yaml（cn12-001）、values-hk-001.yaml（hk-001）。
#
# Environment 006: production-grade resources, dual-active replicas
replicas: 2

nodeSelector:
  kubernetes.io/arch: amd64

squid:
  maxObjectSize: 8192
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2
      memory: 4Gi
  # gy-006：回源缓存 peer（client-first bump 下 https 域重新可用，见 cachepeer/clientfirst-bump/TEST-WORKFLOW.md）
  # ⚠️ 前提：chart 0.1.14 client-first bump。server-first 下 https GET 被 PINNED，
  # peer/never_direct 结构性不可用（JUDGEMENT.md 修订①），故 0.1.13 曾回退至仅 apt-peer。
  # 端口归属：8081=deb 8084=go(Nexus goproxy+goproxy.cn fallback) 8086=pypi origin-form
  # （8086：/simple→huaweicloud /repository/pypi/simple，404 fallback pypi.org；/packages→pythonhosted）
  cachePeer:
    enabled: true
    peers:
    - name: apt-peer
      port: 8081
      domains: ".archive.ubuntu.com .security.ubuntu.com .ports.ubuntu.com .debian.org"
    - name: go-peer
      port: 8084
      domains: ".proxy.golang.org"
    - name: pypi-peer
      port: 8086
      domains: ".pypi.org .files.pythonhosted.org"

images:
  squid:
    # 自建镜像调试期强制拉取最新，避免命中节点上旧的 v7.7.1 标签镜像
    imagePullPolicy: Always

registryProxy:
  # registry 域 splice 到同 Pod 的 rpardini sidecar，blob 缓存 100G（PVC 200Gi）
  cacheMaxSize: "100g"
  proxyReadTimeout: "300s"
  proxySendTimeout: "300s"
  proxyConnectReadTimeout: "300s"
  sendTimeout: "300s"
  exporter:
    # 仓库缓存指标 exporter（只读缓存卷，出 blob 数/磁盘水位），见 registry-exporter-configmap.yaml
    enabled: true
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 8
      memory: 16Gi

persistence:
  squidCache:
    size: 50Gi
  registryCache:
    size: 200Gi

secretDefinition:
  enabled: true
  vaultPath: secrets/data/ascend/ci
  caBundleKey: squid_ca_bundle_v3_pem
  caPublicKey: squid_ca_v3_pem
  caNamespaces:
  - buildkitd
  - ascend-gha-runners
  - nv-action
  - squid
