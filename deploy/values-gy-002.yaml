# 本文件是 **gy-002 集群**（openmerlin-guiyang-002）的 values 文件
#
# 部署时使用（ArgoCD 的 $values 源，或 helm -f）：
#   helm install squid ./chart -f values-gy-002.yaml -n squid --kubeconfig ~/.kube/gy-002.yaml
#
# 调度：nodeAffinity 绑定唯一 cache 节点 10.0.1.220（amd64，label cache=true，taint cache）
# 必须带 cache toleration，否则无法调度到该节点。
#
# Environment gy-002: production-grade resources, dual-active replicas
replicas: 2

nodeSelector:
  kubernetes.io/arch: amd64

nodeAffinity:
  requiredDuringSchedulingIgnoredDuringExecution:
    nodeSelectorTerms:
    - matchExpressions:
      - key: kubernetes.io/hostname
        operator: In
        values:
        - 10.0.1.220

tolerations:
- key: cache
  operator: Equal
  value: "true"
  effect: NoSchedule

# 从私有 SWR registry 拉镜像所需的 pull secret（squid 命名空间已存在同名 secret）
imagePullSecrets:
- name: huawei-swr-image-pull-secret-model-gy

squid:
  maxObjectSize: 8192
  cacheDiskSize: 204800
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2
      memory: 4Gi

registryProxy:
  proxyReadTimeout: "300s"
  proxySendTimeout: "300s"
  proxyConnectReadTimeout: "300s"
  sendTimeout: "300s"
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 8
      memory: 16Gi

persistence:
  squidCache:
    # 注意：volumeClaimTemplates 不可变，size 只影响新建 PVC；
    # 线上 PVC 已手动 kubectl patch 扩到 200Gi（实际生效值）。
    size: 50Gi
    storageClass: harbor-subpath-sc
  registryCache:
    size: 200Gi
    storageClass: harbor-subpath-sc

secretDefinition:
  enabled: true
  vaultPath: secrets/data/ascend/ci
  caBundleKey: squid_ca_bundle_v3_prod_pem
  caPublicKey: squid_ca_v3_prod_pem
  caTruststoreKey: squid_bazel_trust_v3_prod_jks
  # CA 同步到运行 VCJob 的命名空间（gy-002 实测：argo/drivingsdk/fsdpturbo/megatronadaptor/
  # memcache/memfabric-hybrid/mindspeed*/mindspeed-bridge 等），
  # 这样注入代理时 squid-ca-cert 才能挂载进 CI 容器，否则 wget/curl 类工具会因不信任
  # squid CA 而失败（C 类问题）。
  caNamespaces:
  - squid
  - argo
  - drivingsdk
  - fsdpturbo
  - megatronadaptor
  - memcache
  - memfabric-hybrid
  - mindspeed
  - mindspeed-bridge
  - mindspeed-llm
  - mindspeed-mm
  - visionsdk
